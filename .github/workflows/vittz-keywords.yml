name: vittz keyword volumes (키워드 도구 실측 수집)

# 네이버 검색광고 API(keywordstool)로 광고주센터 "키워드 도구"와 동일한
# 월간검색수(PC/모바일)·경쟁정도·연관키워드를 수집해 대시보드에 반영한다.
# 필요한 Secrets: NAVER_AD_API_KEY / NAVER_AD_SECRET / NAVER_AD_CUSTOMER_ID (스킬 표준)
# (광고주센터 → 도구 → API 사용 관리에서 발급. CUSTOMER_ID는 ad-accounts/ 뒤 숫자)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 1 * *' # 매월 1일 10:00 KST — 월간검색수 갱신
    - cron: '0 0 * * 1' # 매주 월요일 09:00 KST — 카테고리 키워드 주간 스냅샷·전월 대비 상승률

permissions:
  contents: write

concurrency:
  group: vittz-keywords
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      PSLAB_REPO: ${{ github.repository }}
      NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
      NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
      NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: 키워드 실측 수집 (배치표 40개 + 연관 발굴)
        run: node scripts/fetch-keyword-volumes.mjs --client vittz

      - name: 카테고리별 핵심 키워드 3종 수집 (주간 스냅샷·전월 대비, 리서치 탭 반영)
        run: node scripts/fetch-category-keywords.mjs --client vittz

      - name: 키워드 3시트 수집 (핵심·연관·시의성 — 기획 지능용)
        continue-on-error: true
        run: node scripts/fetch-keywords.mjs --client vittz

      - name: 차주 콘텐츠 기획 생성 (키워드 기반)
        continue-on-error: true
        run: node scripts/plan-week.mjs --client vittz

      - name: 대시보드 재생성
        run: |
          node dist/cli.js dashboard --out docs/index.html
          if [ -d docs/vittz ]; then node dist/cli.js dashboard --client vittz --out docs/vittz/index.html; fi

      - name: 커밋·푸시
        run: |
          git config user.name "pslab-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in data/clients/vittz/keyword-volumes.json data/clients/vittz/keyword-stats.json data/clients/vittz/keyword-trends.json data/clients/vittz/week-plan.json data/clients/vittz/keyword-category-volumes.json data/clients/vittz/research-brief.json docs/; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          git commit -m "chore(vittz): 키워드 도구 실측 월간검색수 갱신" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && { echo "push 성공"; exit 0; }
            echo "재시도 $i"; sleep 4
          done
          exit 1
