["[2026-08-03 운영자] 기존 디자인 가이드(전구빛 다크) 전부 제거. 레퍼런스로 학습한 내용 기반의 새 디자인 가이드로 교체할 것 — 실사 풀블리드+웜 라이트 문법이 기준.","[2026-08-03 운영자·인스타] ① 한 콘텐츠에서 같은 제품 이미지를 그대로 반복 사용 금지 — 제품 1개 콘텐츠라도 장마다 다른 컷을 쓸 것 (렌더러 컷 로테이션).","[2026-08-03 운영자·인스타] ② 텍스트가 사진 속 제품을 가리지 않도록 배치할 것 (슬라이드별 textPos로 제품 반대편에 텍스트).","[2026-08-03 운영자·인스타] ③ 마지막 장(브랜드 소개·핵심 정리)은 배경 사진 없이 로고만 깔끔하게 (brand 클린 카드).","[2026-08-03 운영자·인스타] ④ 판매 어필보다 상황→문제→해결→제품 흐름으로 자연스럽게. 가격은 눈에 띄지 않게(이름 옆 소자, 가격 히어로 금지).","[2026-08-03 운영자·인스타] ⑤ 캐러셀 프레임에서 로고를 제외한 요소(시리즈 라벨·핸들·도트) 삭제 — 주목도 있고 깔끔하게.","[2026-08-03 운영자] 현행 실사 풀블리드 폼은 '라이프스타일' 주제 디자인 폼으로 고정 기억 — 이 형태 유지, 가이드 엄수.","[2026-08-03 운영자] 주제(designTheme)별로 디자인 폼을 다르게 운영: lifestyle(라이프스타일=현행)/product-pick(제품추천=라이트 패널)/brand-story(브랜드이야기=키 컬러 타이포). 새 주제 폼은 이 구조에 추가.","[2026-08-03 운영자] 텍스트가 잘리지 않게 정리(오토핏·줄바꿈 안전).","[2026-08-03 운영자] 비츠 키 컬러 #110453(로고 딥 인디고, vittz.co.kr 실사용)을 콘텐츠에 녹일 것 — 라벨 칩·브랜드 클로징 로고·제품추천 잉크·브랜드이야기 배경.","[2026-08-03 운영자] 비츠 모든 콘텐츠의 키 컬러를 로고 색상(#110453 딥 인디고)으로 통일 — 앰버 강조 폐기. 어두운 사진 위 강조는 로고색 라이트 틴트(#A9A2FF), 밝은 배경은 원색.","[2026-08-03 운영자] 제품을 어설프게(작은 인셋·잘린 컷) 보여주지 말 것 — 제품 노출 시 가로 꽉 찬 와이드 이미지로 확실하게.","[2026-08-03 운영자] 콘텐츠 제작 전 디자인 레퍼런스(드라이브·reference-links·design-reference.json)를 항상 가이드로 참고하고 시작할 것.","[2026-08-03 운영자] 강조 텍스트 색은 정확한 로고 색(#110453)이어야 함 — 라이트 틴트 금지. 어두운 사진 위 강조는 흰 하이라이트 박스+로고색 글자 방식.","[2026-08-03 운영자·절대 원칙] 제품 이미지는 조금이라도 잘리면 안 된다 — 제품 장은 원본 전체(contain) 와이드 노출(블러 배경으로 무드 유지), 모바일에서도 크게 잘 보이게.","[2026-08-03 운영자] 텍스트 강조(하이라이트)는 제품과 연관성 높은 키워드나 공간 단어 기준으로만 — 예: 에어컨·방등·거실·카페·빛. 감정어·수식어('괜히 더운 밤','그대로' 등) 강조 금지.","[2026-08-03 운영자] 제품 장은 레퍼런스(라이팅플러스) 문법으로 풍성하게 — 공간 무드 컷 풀블리드 배경 + 흰 프레임 액자에 제품 컷 크게. 좌우 흰 여백(레터박스) 금지. 제품 이미지는 자사몰 상세페이지 실사 컷에서 수급(잘리지 않는 원본).","[2026-08-04 릴스·영상] 영상 씬에는 가상의 인물이 자연스럽게 공간을 활용하는 생활감을 담을 것 — 사람이 사는 공간 느낌(캔디드, 카메라 응시 금지). 제품·기구 형태와 무드는 그대로 유지한 채 인물만 자연스럽게.","[2026-08-04 릴스·영상] 첫 장(훅) 자막은 제품 이미지를 가리지 않도록 하단 배치.","[2026-08-04 릴스·영상 v3] 인물은 IKEA 카탈로그 레퍼런스처럼 — 진짜 웃고 대화하는 캔디드 순간, 필름 사진 질감, 흐트러진 생활 디테일(담요·간식·구겨진 옷). 포즈 잡은 듯한 AI스러운 인물 표현 금지(플라스틱 피부·정면 응시·경직 자세).","[2026-08-04 릴스·영상 v3] 제품 가격은 IKEA 카탈로그처럼 상황(씬) 안에 자연스럽게 — 제품을 향한 얇은 지시선 + 제품명(소자) + 가격(볼드)의 인-씬 라벨로 표기. 가격을 별도 자막으로 크게 외치지 않는다.","[2026-08-04 릴스·영상 v4] 자막 하단의 제품명 칩 제거 — 제품명은 인-씬 가격 라벨(상단)에만. 자막·라벨 폰트는 프리텐다드(Pretendard)로 깔끔하고 세련되게.","[2026-08-04 릴스·영상 v4] 영상 카메라 문법: 인물·공간 분위기는 살짝만 보여주고, 카메라가 제품으로 이동해 제품이 화면에 와이드하게 잡히며 다음 장면으로 전환 — 씬마다 제품 포커스로 마무리.","[2026-08-04 UGC] UGC(인플루언서) 영상은 무음 정책의 예외 — 인물 입모양에 싱크된 음성을 넣는다(운영자 지시). 외국 인플루언서는 영어 음성+한글 자막, 브랜드명 'VITTZ'는 반드시 구두로도 언급. 립싱크는 얼굴 클로즈업 씬 우선.","[2026-08-05 블로그 중요지침(구글&네이버) — 운영자] ① SEO/GEO 핵심을 학습해 그에 맞춰 작성(두괄식 답변, 질문형 소제목, 리스트·표, 키워드 제목 전방 배치) ② 포스팅 주제는 '핵심 키워드'로 잡는다 — 핵심 키워드 = 전월 대비 검색량 상승률 최고 키워드(카테고리 키워드 주간 데이터 기준, 상승률 축적 전에는 검색량 최상위·시즌 상승 키워드로 대체) ③ 구글과 네이버는 서로 다른 내용, 구글은 다소 가볍게 ④ 30대 여성의 친근하고 다정한 말투, 고객 입장, 쉬운 비유, 전문 용어 금지 ⑤ 실제 사용 경험 기반 — 결론 먼저(두괄식), 기승전결 스토리 ⑥ 이미지는 홈페이지 제품 이미지 사용(절대 짤리지 않게), 부족하면 힉스필드 등으로 내용에 맞게 생성 ⑦ 본문 2,000~2,500자 ⑧ 마지막에 소개 제품 링크 + 홈페이지(vittz.co.kr) 링크 고정","[2026-08-06 콘텐츠 다양성·영상 지침(운영자) — 학습만, 적용 대기] ① 한 달 이내 발행 콘텐츠 간에는 동일 제품·동일 이미지 재사용 금지 ② 특히 AI로 제작한 이미지는 재사용 금지(1회 사용 원칙) ③ 콘텐츠의 흐름·제작 스타일은 학습한 레퍼런스 기반으로 3개 단위로 변경(같은 스타일 최대 3개 후 전환) ④ 영상의 무빙·스트리밍 방식·모션그래픽은 항상 다르게 제작 ⑤ 영상 편집 방식은 기존 방식을 답습하지 말고 계속 변경·변화 ⑥ 영상용 AI 일상 이미지는 아이폰 촬영 같은 현실 촬영 느낌을 최대한 따를 것 ⑦ 영상 자막·타이포는 일상용어 기반 + '비츠' 브랜드다움을 녹일 것 — 운영자 지시로 기록 시점에는 기존 콘텐츠 수정 없이 다음 제작분부터 적용."]},"heldCount":0,"totalCycles":0,"totalPublished":0,"planUpdatedAt":"2026-08-05T15:00:00.000Z","planCards":[{"id":"test-ig-ceilingfan","topic":"실링팬","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-03T09:00:00.000Z","kicker":"비츠 · 여름 시선","headline":"에어컨만으론 부족한 밤,\u003cbr>*실링팬*이 답일까요?","sub":"우리 집은 어느 쪽인가요 — 댓글로 알려주세요. 실링팬파 🙋 서큘레이터파 🙌","dayLabel":"여름 시선 · 시의성","cardImage":"cards/vittz/test-ig-ceilingfan-1.png","captionNote":"시의성(여름 피크 7~8월, 데이터랩 실링팬 지수 100) 큐레이션. 첫 장 투표형 인터랙션.","captionBody":"열대야에 에어컨 설정온도만 계속 내리고 계신가요? 🌙\n\n찬 공기는 바닥에, 더운 공기는 천장에 — 방 안 공기가 섞이지 않으면 설정온도를 아무리 내려도 시원하지 않아요.\n\n해결은 바람이 아니라 공기 순환입니다.\n천장에서 방 전체 공기를 크게 돌리면 설정온도를 2~3도 올려도 시원하고, 냉방비도 가벼워져요.\n\nLED 블레이드 실링팬 조명은 방등 자리에 그대로 설치하는 조명+팬 결합형이라 타공 걱정이 없고, 겨울엔 역풍 모드로 난방 효율까지 챙기는 사계절 가전이에요.\n\n우리 집 여름 공기 담당, 실링팬파 🙋 vs 서큘레이터파 🙌 — 댓글로 알려주세요!\n설치가 걱정이라면 비츠 딜리버리(배달+설치 한 번에)로 해결하세요. 제품은 프로필 링크에서 👉 @vittz_official\n\n#실링팬 #실링팬조명 #천장선풍기 #여름인테리어 #냉방비절약 #비츠조명 #인테리어조명 #집꾸미기 #비츠","slideImages":["cards/vittz/test-ig-ceilingfan-1.png","cards/vittz/test-ig-ceilingfan-2.png","cards/vittz/test-ig-ceilingfan-3.png","cards/vittz/test-ig-ceilingfan-4.png","cards/vittz/test-ig-ceilingfan-5.png"],"status":"planned"},{"id":"test-ig-standard60","topic":"LED 방등","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-04T09:00:00.000Z","kicker":"비츠 · 제품 노트","headline":"여러분 방등,\u003cbr>몇 년째 *그대로*인가요?","sub":"5년 넘었다면 오늘 카드를 저장해 두세요 — 1만원대로 끝나는 이야기입니다.","dayLabel":"제품 노트 · 디테일","cardImage":"cards/vittz/test-ig-standard60-1.png","captionNote":"제품 개별 디테일 화법(스탠다드 60W). 첫 장 연차 질문 인터랙션 + 저장 유도.","captionBody":"어느 날부터 방이 좀 침침하다고 느낀 적 있나요? 💡\n\n눈이 나빠진 게 아니라 조명이 늙은 것일 수 있어요. LED도 시간이 지나면 밝기가 서서히 줄고, 커버는 누렇게 변합니다.\n\n방등 교체 신호 3가지\n· 커버가 누렇게 변색됐다\n· 켤 때 잠깐 깜빡인다\n· 예전보다 확실히 어둡다\n\n하나라도 해당된다면 교체 타이밍이에요. 델룬 방등은 표준 사이즈라 기존 자리에 그대로 달 수 있고, 삼성 정품 LED 모듈에 플리커프리라 눈이 편해요.\n\n우리 집 방등 연차, 댓글로 알려주세요 🙋\n교체가 걱정이라면 비츠 딜리버리(배달+설치 한 번에)로 해결하세요. 제품은 프로필 링크에서 👉 @vittz_official\n\n#방등 #방등교체 #LED방등 #셀프인테리어 #침실조명 #비츠조명 #인테리어조명 #집꾸미기 #비츠","slideImages":["cards/vittz/test-ig-standard60-1.png","cards/vittz/test-ig-standard60-2.png","cards/vittz/test-ig-standard60-3.png","cards/vittz/test-ig-standard60-4.png","cards/vittz/test-ig-standard60-5.png"],"status":"planned"},{"id":"test-ig-3lights","topic":"조명 레이어링","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-05T09:00:00.000Z","kicker":"비츠 · 조명 레시피","headline":"*거실*이 *카페*처럼\u003cbr>보이는 집,\u003cbr>조명 3개가 다릅니다","sub":"저장해두고 이사·새단장 때 꺼내보세요","dayLabel":"조명 레시피 · 큐레이션","cardImage":"cards/vittz/test-ig-3lights-1.png","captionNote":"레퍼런스 학습 반영: 공간별 큐레이션+넘버링 소제목+가격 명시+저장 유도 클로징(지침 캐러셀 규약). 3광원(베이스·포인트·무드) 공식 — 제품 3종 구매 동선.", ote":"핵심 키워드 실링팬 81,300 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2175자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 실링팬, 에어컨 옆에 달아만 놨는데 전기요금이 달라졌어요\n\n결론부터 말씀드릴게요. 올여름 저희 집 냉방비를 줄여준 건 에어컨이 아니라 천장에 단 실링팬이었어요. 에어컨 설정온도를 26도에서 28도로 올렸는데도 체감은 더 시원했고, 한 달 전기요금이 눈에 띄게 가벼워졌거든요. 오늘은 '실링팬이 처음이라' 막막하신 분들을 위해, 제가 직접 겪은 순서 그대로 풀어드릴게요.\n\n![](blog/w2-nb-fan/scene-1.jpg)\n\n## 실링팬이 뭐길래 시원해질까요?\n\n작년 여름 저희 집 거실은 참 이상했어요. 에어컨 바로 앞은 춥고, 식탁 쪽은 후덥지근하고요. 알고 보니 찬 공기는 무거워서 바닥에 깔리고, 더운 공기는 천장에 떠 있는 거였어요. 방 안 공기가 물과 기름처럼 층층이 나뉘어 있던 거죠.\n\n실링팬은 이 층을 크게 저어주는 국자 같은 역할을 해요. 천장에서 방 전체 공기를 한 번에 크게 돌려주니까, 에어컨 냉기가 구석구석 골고루 퍼지는 거예요. 선풍기처럼 한 방향으로 바람을 쏘는 게 아니라, 방 전체의 공기를 섞어준다는 게 핵심이에요.\n\n![](blog/w2-nb-fan/fig-1.png)\n\n## 그런데 왜 하필 '조명 일체형'이었냐면요\n\n실링팬을 알아보다가 저를 멈칫하게 한 게 천장 타공이었어요. 남의 집도 아니고 우리 집 천장에 구멍을 새로 뚫는다니, 겁이 나더라고요.\n\n그러다 찾은 답이 조명 일체형 실링팬이었어요. 지금 쓰는 방등·거실등을 떼어낸 그 자리에, 조명과 팬이 하나로 된 제품을 그대로 다는 방식이에요. 저는 비츠의 LED 블레이드 실링팬 조명으로 바꿨는데, 기존 등 자리에 설치하니 타공이 필요 없었어요. 낮에는 조명으로, 더울 땐 팬으로, 하나가 두 몫을 해요.\n\n## 한 달 써보니 이게 달라졌어요\n\n첫째, 에어컨 설정온도를 2도 올렸어요. 공기가 순환되니 28도여도 26도처럼 느껴지더라고요. 에어컨은 설정온도를 1도만 올려도 소비 전력이 꽤 줄어든다고 하죠.\n\n둘째, 소리가 조용해요. BLDC 모터라 밤에 아기 재울 때 틀어도 선풍기보다 조용했어요. 도서관에서 책장 넘기는 소리 정도랄까요.\n\n셋째, 겨울에도 쓸 수 있대요. 날개를 반대로 돌리는 역회전 모드로 천장의 따뜻한 공기를 아래로 내려준다고 해서, 사계절 가전으로 쓸 생각이에요.\n\n## 처음이라면 이 세 가지만 확인하세요\n\n1. 우리 집 천장 등 자리에 다는 '조명 일체형'인지 (타공 걱정 끝)\n2. BLDC 모터인지 (소음·전기요금 차이가 커요)\n3. 설치를 맡길 수 있는지 — 비츠는 배달과 설치를 한 번에 해주는 딜리버리가 있어서 저는 주문만 했어요.\n\n여름마다 에어컨 리모컨과 씨름하셨다면, 올해는 천장을 한번 올려다보세요. 등 하나 바꾸는 일로 여름 공기가 달라질 수 있어요.\n\n## 자주 묻는 질문, 제가 겪은 그대로 답해요\n\n**Q. 실링팬 돌리면 에어컨 없이도 시원한가요?**\n한여름 낮엔 솔직히 에어컨이 필요해요. 다만 실링팬을 같이 돌리면 에어컨이 훨씬 여유롭게 일해요. 저희 집은 열대야에 에어컨 28도+실링팬 조합으로 잤는데, 이불을 찾게 되더라고요. 초여름과 초가을엔 실링팬만으로 충분했고요.\n\n**Q. 천장이 낮은 아파트인데 괜찮을까요?**\n저희 집도 평범한 아파트 천장(2.3m 정도)이에요. 조명 일체형은 기존 방등처럼 천장에 붙는 형태라 머리 위 공간을 거의 잡아먹지 않아요. 식탁 의자에 올라서도 손이 안 닿는 높이예요.\n\n**Q. 바람 소리에 예민한 편인데요.**\n저도 그래요. 그래서 BLDC 모터를 고집했어요. 1단으로 돌리면 공기가 움직이는 게 느껴지는데 소리는 안 들려요. 자다가 깬 적이 한 번도 없어요.\n\n**Q. 청소는 어떻게 하나요?**\n계절 바뀔 때 날개를 마른 천으로 한 번 닦아주는 게 전부였어요. 날개가 천장 가까이 있어서 생각보다 먼지가 덜 쌓이더라고요.\n\n## 여름이 오기 전에 준비하면 좋은 이유\n\n실링팬은 이상하게 더위가 시작되면 품절이 잦아요. 작년에 7월에 알아봤다가 설치까지 2주를 기다렸거든요. 올해는 6월에 미리 달아뒀더니 첫 폭염부터 여유로웠어요. 에어컨처럼 큰돈 드는 공사가 아니라, 등 하나 바꾸는 마음으로 시작할 수 있다는 것. 그게 제가 실링팬을 주변에 권하는 이유예요.\n\n![](products/vittz/blade.jpg)\n\n---\n**이 글에서 소개한 제품**\n- LED 블레이드 BLDC 천장 실링팬 조명 → https://vittz.co.kr/shop/shopdetail.html?branduid=1100006949\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-living","topic":"거실등 교체","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-10T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"거실이 어두워 보이는 *진짜 이유*","sub":"핵심 키워드: 거실LED등 (월간 14,510회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-living/cover.png","captionNote":"핵심 키워드 거실LED등 14,510 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2125자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 거실이 어두워 보이는 진짜 이유, 등 탓이 맞았어요\n\n결론부터요. 저희 집 거실이 칙칙해 보였던 범인은 소파도 벽지도 아니고 5년 넘은 거실등이었어요. LED 거실등으로 바꾸고 나서 \"집 넓어졌어?\"라는 말을 들었거든요. 가볍게, 딱 필요한 것만 정리해 드릴게요.\n\n![](blog/w2-gb-living/scene-1.jpg)\n\n## 거실등도 늙는다는 사실, 아셨어요?\n\nLED는 반영구인 줄 알았는데 아니더라고요. 형광등처럼 팍 나가는 게 아니라, 몇 년에 걸쳐 조금씩 어두워져요. 매일 보는 우리 눈은 그 변화를 눈치채지 못하고요. 휴대폰 배터리가 서서히 닳는 것처럼, 빛도 서서히 닳아요.\n\n우리 집 등이 늙었는지 확인하는 법은 간단해요. 밤에 거실 사진을 한 장 찍어보세요. 사진이 눈으로 보는 것보다 누렇고 어둡게 나오면, 등이 보내는 신호예요.\n\n![](blog/w2-gb-living/fig-1.png)\n\n## 바꿀 때 딱 두 가지만 보세요\n\n**첫째, 와트(W)는 평수 따라.** 20평대는 120~150W, 30평대는 150~180W가 기준이에요. 지금 어둡게 느껴진다면 한 단계 위로 가세요. 후회 없어요.\n\n**둘째, 플리커프리인지.** 빛이 미세하게 깜빡이는 걸 걸러주는 기능인데, 눈 피로가 달라져요. 저는 델룬 LED 거실등 180W로 바꿨는데, 삼성 정품 LED 모듈에 플리커프리라 저녁에 TV 볼 때 눈이 한결 편해졌어요.\n\n## 교체, 생각보다 일이 아니에요\n\n저는 전기 기사님을 따로 부를 줄 알았는데, 비츠 딜리버리로 배달과 설치를 한 번에 예약했어요. 기사님이 오셔서 20분 만에 끝났고, 저는 커피만 내렸어요.\n\n등을 바꾼 날 저녁, 거실이 한 뼘 넓어 보였어요. 벽지 색이 원래 이랬구나 싶었고요. 이사 없이 집 분위기를 바꾸는 방법 중 이만한 가성비가 없어요.\n\n## 이왕 바꾸는 김에 알아두면 좋은 것들\n\n**색온도 변환 기능**은 있으면 확실히 써요. 낮엔 하얀빛으로 또렷하게, 저녁엔 노란빛으로 아늑하게, 리모컨으로 바꾸는 기능이에요. 저는 주말 아침 청소할 때는 주광색, 저녁 영화 볼 때는 전구색으로 바꿔 쓰는데, 거실이 두 얼굴이 됐어요.\n\n**KC 인증**도 확인하세요. 천장에서 매일 몇 시간씩 켜두는 물건이라, 안전 인증은 기본이에요. 정품 LED 모듈을 쓰는지도요. 모듈이 부실하면 몇 년 못 가 또 어두워지거든요.\n\n## 자주 묻는 질문 하나만\n\n**Q. 등 교체 시기를 숫자로 알 수 있나요?**\nLED 거실등의 밝기 수명은 보통 5~7년이라고 해요. 이사 올 때부터 있던 등이거나, 언제 달았는지 기억이 안 난다면 그게 신호예요. 저희 집 등도 '전 주인 때부터 있던 등'이었어요.\n\n## 바꾸고 나서 한 달, 솔직 후기\n\n가장 좋은 건 사진이에요. 거실에서 아이 사진을 찍으면 예전엔 다 누렇게 나와서 보정을 했는데, 지금은 찍은 그대로 써요. 그리고 이상하게 저녁에 거실에 모이는 시간이 늘었어요. 밝고 쾌적한 곳으로 사람이 모이는 건 본능인가 봐요. 도배나 이사를 고민 중이셨다면, 그 전에 등부터 바꿔보세요. 비용은 10분의 1인데 체감은 절반쯤 따라와요.\n\n## 셀프 교체를 생각 중이라면 딱 한 가지만\n\n유튜브 보면 셀프 교체가 쉬워 보이는데, 딱 하나만 꼭 지켜주세요. 차단기를 내리고 작업하기. 천장 조명 작업은 감전과 낙상 사고가 가장 많은 집안일이에요. 사다리 위에서 두 손을 다 쓰는 작업이라, 자신 없으면 설치 서비스를 쓰는 게 몸에도 마음에도 이득이에요. 저처럼 커피 내리면서 기다리는 쪽을 추천할게요.\n\n## 오늘의 요약\n\n- 거실이 칙칙하면 벽지보다 등부터 의심하기 (LED도 5~7년이면 어두워져요)\n- 와트는 평수 기준 한 단계 여유 있게, 플리커프리는 필수\n- 색온도 변환이 있으면 거실이 두 얼굴이 됨\n- 설치는 배달+설치 한 번에, 무리한 셀프 작업은 금물\n\n마지막으로 하나 더. 등을 바꾸는 김에 리모컨 수신 기능이 있는 제품을 고르면, 침대나 소파에서 끄고 켤 수 있어요. 사소해 보이는데, 겨울밤 이불 밖으로 나가서 스위치 끄러 가는 일이 사라지는 건 생각보다 큰 행복이에요.\n\n![](products/vittz/delun180.jpg)\n\n---\n**이 글에서 소개한 제품**\n- LED 델룬 거실등 180W → https://vittz.co.kr/shop/shopdetail.html?branduid=1100006932\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-th-intro","topic":"쓰레드 개국 인사","format":"스레드","channels":["threads"],"scheduledFor":"2026-08-10T09:00:00.000Z","kicker":"VITTZ 빛 수다","headline":"쓰레드 개국 인사","sub":"직원 자아 페르소나 — 반말 수다 톤","dayLabel":"쓰레드","captionNote":"쓰레드 레퍼런스 학습 반영: 직원 자아(스픽)·혼용률 공개 메타(WCONCEPT)·말걸기/이모지 불릿(29CM)·상담 포맷. 광고는 광고라고 밝히는 티키타카.","captionBody":"조명 회사 다니는 사람의 빛 수다 계정, 오늘 개국함\n(마케팅팀 허락은 안 받음. 스픽님 감사합니다 선례 남겨주셔서)\n\n앞으로 올릴 것들:\n- 조명 고르다 현타 온 사연 상담 40%\n- 우리 사무실 조명 비하인드 25%\n- 진짜 쓸만한 빛 꿀팁 25%\n- 신제품 자랑(광고) 10%\n\n광고일 땐 광고라고 말할게. 약속.","status":"planned"},{"id":"w2-ig-fan","topic":"열대야 실링팬","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-10T09:00:00.000Z","kicker":"비츠 · 여름 공기","headline":"새벽 2시, *에어컨*은\u003cbr>죄가 없었습니다","sub":"열대야에 잠 못 드는 진짜 이유","dayLabel":"인스타그램","cardImage":"cards/vittz/w2-ig-fan-1.png","captionNote":"레퍼런스 문법: 상황→문제→해결→제품→브랜드. 컷 로테이션 blade 0→3. 공간 키워드 강조(에어컨·바닥·천장).","captionBody":"열대야에 에어컨 리모컨만 만지던 밤, 문제는 온도가 아니라 공기였어요.\n\n찬 공기는 바닥에, 더운 공기는 천장에 — 섞어주지 않으면 계속 덥습니다.\nLED 블레이드 실링팬 조명은 방등 자리에 그대로 설치하는 조명+팬 결합형이라 타공 걱정이 없어요.\n\n설정온도 2~3도 여유가 생기는 여름의 비밀, 저장해두세요.\n제품은 프로필 링크에서 👉 @vittz_official\n\n#비츠조명 #실링팬 #실링팬조명 #열대야 #여름인테리어 #냉방비절약 #방등 #비츠","slideImages":["cards/vittz/w2-ig-fan-1.png","cards/vittz/w2-ig-fan-2.png","cards/vittz/w2-ig-fan-3.png","cards/vittz/w2-ig-fan-4.png","cards/vittz/w2-ig-fan-5.png","cards/vittz/w2-ig-fan-6.png"],"status":"planned"},{"id":"w2-nb-dining","topic":"식탁등","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-11T09:00:00.000Z","kicker":"VITTZ 조명 가이드","headline":"*식탁등* 하나로 집에서 카페 하는 법","sub":"핵심 키워드: 식탁등 (월간 17,820회)","dayLabel":"네이버 블로그","cardImage":"blog/w2-nb-dining/cover.png","captionNote":"핵심 키워드 식탁등 17,820 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2208자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 식탁등 하나 바꿨을 뿐인데, 저녁마다 집에서 카페 하고 있어요\n\n먼저 결론이요. 저희 집 저녁 풍경을 바꾼 건 소파도 원목 테이블도 아니고, 식탁 위에 매단 등 하나였어요. 식탁등을 유리 펜던트로 바꾼 날부터 남편이 퇴근하면 식탁에 앉아요. 예전엔 밥만 먹고 소파로 직행했거든요. 오늘은 그 얘기를 들려드릴게요.\n\n![](blog/w2-nb-dining/scene-1.jpg)\n\n## 우리 집 식탁이 창고 같았던 이유\n\n이사 왔을 때 식탁 위엔 천장에 붙는 네모난 등이 있었어요. 밝기는 충분한데, 이상하게 식탁에 앉으면 사무실 같았어요. 카페에서는 두 시간도 앉아 있으면서 왜 우리 집 식탁은 10분 만에 일어나게 될까, 한참 생각했어요.\n\n답은 빛의 높이였어요. 카페 조명은 테이블 가까이 낮게 내려와 있잖아요. 빛이 얼굴과 테이블 주변만 감싸니까 그 자리가 아늑한 방처럼 느껴지는 거예요. 천장에서 방 전체를 환하게 비추는 빛은 '업무용', 낮게 내려와 테이블만 비추는 빛은 '머무는 용'이더라고요.\n\n![](blog/w2-nb-dining/fig-1.png)\n\n## 유리 펜던트를 고른 날\n\n그래서 식탁등을 알아보다가 비츠의 세라핌 인테리어 식탁등을 골랐어요. 컬러 유리 안에 전구가 들어 있는 펜던트인데, 처음엔 '유리가 너무 튀지 않을까' 걱정했어요.\n\n그런데 실물은 반대였어요. 불을 안 켠 낮에는 식탁 위에 떠 있는 유리 오브제 같고, 저녁에 불을 켜면 유리 결을 따라 빛이 퍼지면서 테이블 위에 동그란 빛 웅덩이가 생겨요. 사탕 유리병 안에 촛불을 켠 듯한 느낌이라고 하면 비슷할까요.\n\n## 달고 나서 달라진 저녁\n\n설치한 첫 주에 벌써 습관이 바뀌었어요. 밥을 먹고 나서도 식탁에 그대로 앉아 과일을 깎고, 아이 숙제도 식탁에서 봐요. 주말 밤엔 남편과 식탁에서 맥주 한 캔을 마시는데, 거실 등을 다 끄고 펜던트만 켜면 정말 우리 집이 조용한 카페가 돼요.\n\n포인트는 밝기 조절이 아니라 '빛의 범위'였어요. 온 집을 밝히지 않고 식탁 위 1미터만 밝히는 것. 그게 카페 무드의 전부더라고요.\n\n## 식탁등 고를 때 제가 배운 것\n\n1. 높이가 생명 — 식탁 위 60~80cm까지 과감하게 내리세요. 머리에 닿을까 걱정되지만, 앉으면 눈높이 위라 안 걸려요.\n2. 전구색(따뜻한 노란빛)으로 — 흰 빛이면 카페가 아니라 급식실이 돼요.\n3. 설치가 겁나면 맡기세요 — 저는 비츠 딜리버리로 배달과 설치를 한 번에 해결했어요.\n\n식탁은 하루 중 가족이 가장 오래 마주 앉는 자리잖아요. 그 자리 위의 빛 하나가 저녁의 온도를 바꿔요. 진심이에요.\n\n## 자주 묻는 질문도 정리해봤어요\n\n**Q. 유리 펜던트, 깨질까 봐 걱정돼요.**\n저도 아이가 있어서 제일 먼저 걱정한 부분이에요. 식탁 위는 사람이 지나다니는 동선이 아니라서 부딪힐 일이 거의 없더라고요. 2년째 쓰는 지금까지 이가 나간 적도 없어요.\n\n**Q. 전구는 아무거나 끼우면 되나요?**\n따뜻한 전구색(3000K 정도)을 추천해요. 저는 처음에 집에 있던 하얀 주광색 전구를 끼웠다가 바로 바꿨어요. 같은 등인데 빛 색 하나로 급식실과 카페를 오가더라고요.\n\n**Q. 식탁 위에 등이 하나면 어둡지 않나요?**\n밥 먹고 책 읽는 데는 충분해요. 다만 식탁에서 공부나 바느질처럼 정밀한 일을 오래 한다면, 그때만 거실등을 함께 켜면 돼요. 평소엔 펜던트 하나가 만드는 아늑함이 훨씬 커요.\n\n**Q. 원형 식탁인데 어울릴까요?**\n원형 식탁엔 등 하나를 정중앙에 다는 게 제일 예뻐요. 저희는 4인 사각 식탁이라 중앙에 하나 달았는데, 6인 이상 긴 식탁이면 두 개를 나란히 다는 것도 좋대요.\n\n## 등 하나로 시작하는 우리 집 카페\n\n돌아보면 저는 인테리어를 크게 바꾼 게 아니었어요. 가구도 그대로, 벽지도 그대로였죠. 바뀐 건 식탁 위 빛의 높이와 색, 딱 두 가지였어요. 그런데 가족이 식탁에 머무는 시간은 두 배가 됐어요. 오늘 저녁, 식탁 위를 한번 올려다보세요. 그 자리가 우리 집에서 가장 아까운 자리일지도 몰라요.\n\n덧붙이면, 계절마다 전구 하나로 분위기를 갈아입힐 수도 있어요. 여름엔 살짝 밝은 전구로 청량하게, 겨울엔 더 노란 전구로 포근하게. 등은 그대로 두고 전구만 바꾸는 건데, 커튼 바꾸는 것보다 쉽고 효과는 더 커요.\n\n![](products/vittz/seraphim.jpg)\n\n---\n**이 글에서 소개한 제품**\n- 세라핌 1등 인테리어 식탁등 → https://vittz.co.kr/shop/shopdetail.html?branduid=1100003357\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-rail","topic":"레일조명","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-11T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"카페 벽 조명, *레일 하나*면 됩니다","sub":"핵심 키워드: 레일조명 (월간 11,700회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-rail/cover.png","captionNote":"핵심 키워드 레일조명 11,700 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2142자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 카페 벽 조명, 알고 보니 레일 하나면 따라 할 수 있어요\n\n결론 먼저요. 분위기 좋은 카페 벽의 그 빛, 레일조명 하나로 우리 집에서 재현됩니다. 저는 다이닝 벽에 레일 하나 달고 스팟 세 개 끼웠는데, 친구가 오더니 \"여기 카페야?\"라고 했어요. 방법만 가볍게 정리할게요.\n\n![](blog/w2-gb-rail/scene-1.jpg)\n\n## 카페 벽이 예뻐 보이는 비밀\n\n카페에 가면 벽에 빛이 부챗살처럼 흘러내리죠. 저건 벽을 향해 스팟 조명을 쏘는 '월 워싱'이라는 기법이에요. 빛이 벽의 질감을 타고 흐르면서 밋밋한 벽이 갑자기 입체적으로 보여요. 낮과 밤의 얼굴이 달라지는 거죠.\n\n집에서 이걸 하려면 조명을 여러 개 달아야 할 것 같지만, 레일조명은 반대예요. 천장에 레일 한 줄을 달고, 그 위에 스팟을 원하는 개수만큼 끼우는 방식이거든요. 콘센트 멀티탭처럼, 자리만 만들어두면 조명을 더하고 빼고 옮기는 게 자유로워요.\n\n![](blog/w2-gb-rail/fig-1.png)\n\n## 제가 단 방법 (아주 간단해요)\n\n저는 비츠의 COB 젤로비 레일조명을 골랐어요. 스팟 하나가 만원대라 부담이 없었고, 나중에 하나씩 추가할 수 있다는 게 결정적이었어요.\n\n배치는 이렇게 했어요.\n1. 스팟 하나는 벽의 그림을 향해\n2. 하나는 선반 소품을 향해\n3. 하나는 식탁 모서리를 살짝 스치게\n\n포인트는 정면이 아니라 비스듬히 쏘는 거예요. 빛이 스치듯 지나가야 그림자가 생기면서 카페 느낌이 나요. 손전등을 벽에 바짝 대고 비스듬히 비춰보면 어떤 느낌인지 바로 아실 거예요.\n\n## 한 달 써보니\n\n저녁에 거실 큰 등을 끄고 레일 스팟만 켜는 날이 많아졌어요. 같은 집인데 빛의 방향만 바뀌었을 뿐인데도, 하루의 끝이 좀 근사해졌달까요. 인테리어 소품 열 개보다 스팟 세 개가 나았어요.\n\n## 이런 분들께 특히 추천해요\n\n- 전셋집이라 못질·타공이 부담스러운 분 — 레일은 기존 등 자리 배선을 활용하는 시공이 가능해서 부담이 적어요.\n- 그림·포스터를 걸어둔 분 — 스팟 하나가 그림을 갤러리 작품으로 만들어요.\n- 조명 초보인 분 — 스팟 하나부터 시작해서 취향 따라 늘리면 돼요. 실패 비용이 만원대예요.\n\n## 자주 묻는 질문\n\n**Q. 전기요금 많이 나오지 않나요?**\nCOB LED 스팟은 하나에 10~30W 수준이에요. 스팟 세 개를 저녁 내내 켜도 형광등 하나보다 가벼워요.\n\n**Q. 빛이 눈부시지 않나요?**\n스팟을 사람 쪽이 아니라 벽·소품 쪽으로 돌리는 게 규칙이에요. 우리는 빛을 직접 보는 게 아니라, 벽에 반사된 부드러운 빛을 즐기는 거니까요.\n\n**Q. 레일 색은 뭐가 좋아요?**\n천장이 흰색이면 흰 레일이 감쪽같고, 카페처럼 힘을 주고 싶으면 검정 레일이 예뻐요. 저는 검정을 골랐는데 낮에는 그 자체로 인테리어 라인이 돼요.\n\n## 마지막 팁 하나\n\n레일조명의 진짜 매력은 '바꿀 수 있다'는 거예요. 계절 따라 그림을 바꾸듯 스팟 방향만 틀어도 집 분위기가 갈아입어져요. 오늘은 벽으로, 크리스마스엔 트리로. 조명이 소모품이 아니라 취미가 되는 경험, 레일에서 시작해보세요.\n\n## 오늘의 요약\n\n- 카페 벽의 비밀은 '월 워싱' — 벽에 비스듬히 빛을 흘리는 것\n- 레일 한 줄 + 스팟 세 개면 시작 충분, 스팟은 만원대부터\n- 스팟은 사람이 아니라 벽·그림·소품을 향하게\n- 나중에 취향 따라 추가·이동 가능한 게 레일의 진짜 매력\n\n## 하나 더 — 계절마다 스팟 방향 바꾸기\n\n저는 계절이 바뀔 때 스팟 방향을 조금씩 틀어요. 여름엔 시원한 그림 쪽으로, 연말엔 트리 쪽으로. 조명이 바뀌면 같은 집이 새 집처럼 보여요. 가구 재배치보다 힘이 10분의 1인데 효과는 비슷해요. 레일조명은 사놓고 끝나는 게 아니라 계속 갖고 노는 조명이라는 것, 이게 제가 레일을 추천하는 진짜 이유예요.\n\n그리고 처음 다는 분들이 자주 묻는 것 하나 — \"레일 길이는 얼마가 좋아요?\" 1m면 스팟 2~3개, 1.5m면 3~4개가 여유롭게 들어가요. 벽 폭의 3분의 2 정도 길이로 고르면 비율이 안정적이에요. 스팟 간격은 40~50cm가 무난하고, 너무 촘촘하면 빛이 겹쳐서 오히려 입체감이 죽어요.\n\n![](products/vittz/jelrobi.jpg)\n\n---\n**이 글에서 소개한 제품**\n- COB 젤로비 레일조명 → https://vittz.co.kr/shop/shopdetail.html?branduid=2081318\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-th-flicker","topic":"플리커 수다","format":"스레드","channels":["threads"],"scheduledFor":"2026-08-11T09:00:00.000Z","kicker":"VITTZ 빛 수다","headline":"플리커 수다","sub":"직원 자아 페르소나 — 반말 수다 톤","dayLabel":"쓰레드","captionNote":"쓰레드 레퍼런스 학습 반영: 직원 자아(스픽)·혼용률 공개 메타(WCONCEPT)·말걸기/이모지 불릿(29CM)·상담 포맷. 광고는 광고라고 밝히는 티키타카.","captionBody":"휴대폰 슬로모드 켜고 집 천장등 한번 찍어봐\n\n화면에 줄무늬 지나가면 그 등, 눈에 안 보이게 깜빡이는 중임 (플리커라고 함)\n하루종일 그 밑에서 눈이 일하고 있었던 거야\n\n요즘 등은 플리커프리가 기본인데\n5년 넘은 등이면… 몰랐던 게 아니라 등이 옛날 거임\n\n너네 집 결과 궁금하다 댓글로 알려줘","status":"planned"},{"id":"w2-ig-goodnight","topic":"아이 취침 루틴","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-11T09:00:00.000Z","kicker":"비츠 · 밤의 루틴","headline":"\"불 꺼줘\"가 아니라\u003cbr>\"*노란불* 켜자\"","sub":"아이 재우기가 쉬워지는 빛 사용법","dayLabel":"인스타그램","cardImage":"cards/vittz/w2-ig-goodnight-1.png","captionNote":"컷 로테이션 bang60 0→2. 공간 키워드 강조(노란불·한 단계·침실).","captionBody":"아이를 재울 때 \"불 꺼줘\"보다 좋은 말이 있어요 — \"노란불 켜자\".\n\n갑자기 캄캄해지는 게 무서운 거지, 어둠이 무서운 게 아니더라고요.\n하얀빛→노란빛→취침 모드, 빛을 한 단계씩 줄여주면 아이 몸이 잘 시간을 기억해요.\n\nLED 델룬 방등 60W는 리모컨 색온도 변환으로 공부방과 침실을 오갑니다.\n제품은 프로필 링크에서 👉 @vittz_official\n\n#비츠조명 #방등 #LED방등 #아이방조명 #취침루틴 #육아템 #침실조명 #비츠","slideImages":["cards/vittz/w2-ig-goodnight-1.png","cards/vittz/w2-ig-goodnight-2.png","cards/vittz/w2-ig-goodnight-3.png","cards/vittz/w2-ig-goodnight-4.png","cards/vittz/w2-ig-goodnight-5.png"],"status":"planned"},{"id":"w2-nb-bang","topic":"아이방 방등","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"VITTZ 조명 가이드","headline":"아이 *방등* 바꾸고 달라진 숙제 시간","sub":"핵심 키워드: LED방등 (월간 6,030회)","dayLabel":"네이버 블로그","cardImage":"blog/w2-nb-bang/cover.png","captionNote":"핵심 키워드 LED방등 6,030 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2120자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 아이 방 방등 바꾸고 알았어요, 숙제 시간이 짧아진 이유\n\n결론부터요. 아이가 \"눈 아파\"라며 30분 만에 책상을 떠나던 게, 방등 하나 바꾸고 나서 눈에 띄게 줄었어요. 방등은 그냥 밝으면 되는 줄 알았는데, 아니었더라고요. 오늘은 아이 방 등을 고르며 배운 걸 처음 겪는 분들 눈높이로 정리해 드릴게요.\n\n![](blog/w2-nb-bang/scene-1.jpg)\n\n## 아이가 자꾸 눈을 비비던 이유\n\n작년 겨울, 초등 2학년 딸아이가 숙제하다 자꾸 눈을 비볐어요. 시력 걱정에 안과부터 갔는데, 의사 선생님이 뜻밖의 질문을 하셨어요. \"방 조명이 오래됐나요?\"\n\n집에 와서 방등을 올려다보니, 이사 올 때부터 있던 정체 모를 등이었어요. 그리고 처음 알았어요. 오래된 등은 우리 눈에 안 보이는 속도로 깜빡인다는 걸요(이걸 플리커라고 부르더라고요). 형광등 아래에서 오래 있으면 머리가 지끈했던 기억, 다들 있으시죠? 그 원리예요. 눈은 그 깜빡임을 쫓아가느라 계속 일을 하는 거래요.\n\n![](blog/w2-nb-bang/fig-1.png)\n\n## 방등을 고르며 배운 세 가지\n\n**첫째, 플리커프리.** 깜빡임을 걸러준 빛이에요. 아이 방이라면 저는 이게 밝기보다 먼저라고 생각해요.\n\n**둘째, 색온도 변환.** 낮 숙제 시간엔 하얀빛(집중 모드), 잠들기 전엔 노란빛(포근 모드)으로 리모컨 하나로 바뀌어요. 하나의 등이 공부방과 침실을 오가는 셈이죠.\n\n**셋째, 정품 LED 모듈.** 등의 심장이에요. 심장이 튼튼해야 몇 년이 지나도 밝기가 덜 떨어져요. 저는 삼성 정품 모듈을 쓴 비츠 델룬 방등 60W로 바꿨어요. 가격도 부담스럽지 않았고요.\n\n## 바꾸고 한 달, 달라진 것들\n\n숙제 시간에 눈 비비는 횟수가 줄었어요. 그리고 재미있는 변화가 하나 더 있는데, 잠들기 전 노란빛으로 바꿔주면 아이가 \"취침등 켜졌다\"며 스스로 이불로 들어가요. 빛이 생활 리듬의 스위치가 된 거예요.\n\n사진도 달라졌어요. 아이 방에서 찍는 사진마다 누렇게 나와서 고민이었는데, 지금은 낮처럼 깨끗하게 나와요.\n\n## 자주 묻는 질문\n\n**Q. 방등은 몇 와트가 적당해요?**\n일반 침실·아이 방은 50~60W면 충분해요. 거실등(120~180W)과 헷갈리지 마세요. 방이 너무 밝으면 오히려 잠들기 어려워요.\n\n**Q. 교체가 어렵지 않나요?**\n기존 방등 자리에 그대로 다는 거라 큰 공사는 아니에요. 다만 천장 작업이 겁나면 저처럼 배달+설치를 한 번에 해주는 비츠 딜리버리를 쓰세요. 20분이면 끝나요.\n\n**Q. 아이가 무서워하는 어둠, 어떻게 해요?**\n색온도 변환 등의 노란빛을 '한 단계 어둡게' 켜두는 걸로 해결했어요. 따로 수면등을 사기 전에 방등의 조광 기능부터 확인해 보세요.\n\n## 마무리하며\n\n아이 방 인테리어를 고민할 때 우리는 책상, 침대, 벽지 순서로 생각하잖아요. 그런데 아이가 하루 중 가장 오래 마주 보는 건 사실 천장의 빛이에요. 등 하나 바꾸는 일, 생각보다 큰 선물이 될 수 있어요.\n\n## 방등과 함께 챙기면 좋은 것\n\n방등을 바꾸면서 저는 책상 스탠드도 점검했어요. 방 전체는 방등이, 책 위는 스탠드가 나눠 맡는 구조가 눈에 제일 편하대요. 방등만 쨍하게 밝히고 스탠드 없이 공부하면, 책에 내 그림자가 지거든요. 방등은 은은하게 + 스탠드는 또렷하게, 이 조합을 기억해 두세요.\n\n그리고 등을 바꾸는 김에 방 안 빛의 색을 통일해 주면 좋아요. 방등은 하얀빛인데 스탠드는 노란빛이면, 눈이 두 가지 빛 사이를 오가며 피로해져요. 낮 공부 시간엔 둘 다 하얀 계열로, 저녁엔 둘 다 노란 계열로 맞춰주는 게 포인트예요.\n\n## 한 달 뒤, 남편이 한 말\n\n\"어, 애 방이 제일 좋아 보이네?\" — 등 하나 바꿨을 뿐인데요. 아이 방 인테리어에서 조명은 가장 저렴한데 가장 티가 많이 나는 항목이었어요. 다음 목표는 저희 안방이에요.\n\n책상 위치도 함께 봐주면 금상첨화예요. 방등 바로 아래보다 창가 쪽, 빛이 왼손 방향에서 들어오는 자리(오른손잡이 기준)가 그림자가 덜 져요. 등을 바꾸는 날, 책상 방향도 한 번만 점검해 보세요.\n\n![](products/vittz/bang60.jpg)\n\n---\n**이 글에서 소개한 제품**\n- LED 델룬 방등 60W → https://vittz.co.kr/shop/shopdetail.html?branduid=1100006929\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-sensor","topic":"현관 센서등","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"현관 *센서등* 5분 해결법","sub":"핵심 키워드: 센서등 (월간 15,360회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-sensor/cover.png","captionNote":"핵심 키워드 센서등 15,360 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2067자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 현관 센서등이 나갔을 때, 5분 만에 끝내는 법\n\n결론부터요. 현관 센서등 교체는 겁먹을 일이 아니었어요. 포인트만 알면 제품 고르기 5분, 설치는 기사님 오시면 10분이에요. 어두운 현관에서 신발 찾다 현타 온 분들을 위해 가볍게 정리했어요.\n\n![](blog/w2-gb-sensor/scene-1.jpg)\n\n## 센서등이 하는 일, 생각보다 커요\n\n현관 센서등은 집의 첫인사예요. 문 열고 들어왔을 때 자동으로 켜지는 그 2초가, 집이 나를 반겨주는 느낌을 만들거든요. 반대로 센서등이 나가면? 캄캄한 현관에서 벽을 더듬는 순간, 하루의 피로가 두 배가 돼요.\n\n손님이 왔을 때 첫인상도 현관 빛이 만들어요. 밝고 따뜻한 현관은 그 집 전체를 정돈돼 보이게 해요.\n\n![](blog/w2-gb-sensor/fig-1.png)\n\n## 고를 때 딱 세 가지만 보세요\n\n**첫째, 센서 방식.** 요즘은 대부분 움직임을 감지하는 방식이에요. 감지 범위가 넓을수록 문을 열자마자 켜져요.\n\n**둘째, 밝기와 빛 색.** 현관은 8~15W면 충분해요. 빛 색은 집 분위기 따라 — 아늑한 게 좋으면 전구색, 깔끔한 게 좋으면 주백색이요.\n\n**셋째, 디자인.** 현관 천장은 좁아서 등이 곧 인테리어예요. 얇고 심플한 원형이 어떤 집이든 무난하게 어울려요.\n\n## 이런 신호면 교체 타이밍이에요\n\n- 들어와서 두세 걸음 걸어야 켜진다 (센서 노화)\n- 켜지는 데 1초 이상 걸린다\n- 벌레 그림자가 비친다 (커버 틈새 벌어짐)\n\n저희 집은 세 번째였어요. 여름마다 등 안에 작은 벌레가... 더 말하지 않을게요. 얇은 일체형으로 바꾸고 해결됐어요.\n\n## 셀프로 갈까, 맡길까\n\n센서등은 천장 등 중에 가장 작고 가벼워서 셀프 난도가 낮은 편이에요. 다만 차단기 내리는 것만은 꼭 지켜주세요. 사다리 작업이 부담이면 설치 서비스로 — 비츠는 배달과 설치를 한 번에 해결해주는 딜리버리가 있어요.\n\n## 오늘의 요약\n\n- 센서등은 집의 첫인사, 나가면 삶의 질이 확 떨어짐\n- 고르기: 감지 잘 되는지 · 8~15W · 얇고 심플한 디자인\n- 늦게 켜지고 벌레 그림자 보이면 교체 신호\n- 셀프든 설치든, 차단기부터 내리기\n\n## 센서등을 200% 쓰는 작은 팁\n\n**신발장 안에도 하나.** 요즘은 배터리식 무선 센서등도 있어서, 신발장 문을 열면 켜지게 붙여두면 아침에 신발 찾기가 편해져요.\n\n**복도 중간에도 유용해요.** 밤에 아이 방과 화장실을 오가는 동선에 센서등이 있으면, 스위치를 더듬지 않아도 돼요. 특히 부모님 댁에 선물로 좋아요 — 야간 낙상 예방에 이만한 게 없거든요.\n\n**감지 시간도 확인하세요.** 켜져 있는 시간이 너무 짧으면 신발 신다가 꺼져요. 30초~1분 정도 유지되는 제품이 현관용으로 넉넉해요.\n\n## 저희 집 교체 후기 한 줄\n\n바꾸고 나서 제일 좋았던 순간은, 두 손 가득 장 봐온 날이었어요. 팔꿈치로 문 열고 들어서자마자 환하게 켜지는 현관. 별거 아닌데, 집이 \"고생했어\" 하고 맞아주는 기분이더라고요. 조명은 결국 그런 거 같아요. 기능은 기본이고, 기분을 만드는 것.\n\n## 같이 보면 좋은 조합\n\n현관 센서등을 바꾸는 김에 저는 복도 등까지 색을 맞췄어요. 현관은 전구색, 복도는 하얀빛이면 문 하나 사이로 빛이 뚝 끊겨 보이거든요. 현관→복도→거실로 이어지는 빛 색이 자연스럽게 연결되면, 집에 들어오는 동선 전체가 하나의 장면처럼 느껴져요. 등 하나가 아니라 '들어오는 길'을 디자인한다고 생각하면 골라야 할 답이 쉽게 보여요.\n\n마지막으로 비용 얘기를 솔직하게 하면, 센서등은 조명 중에 가장 부담 없는 축이에요. 제품은 1~3만 원대가 중심이고, 교체도 금방이라 '집에서 가장 가성비 좋은 업그레이드'로 꼽고 싶어요. 매일 최소 두 번(나갈 때, 들어올 때)은 만나는 빛이니까, 하루로 나누면 커피 한 잔 값도 안 되는 투자예요.\n\n그리고 이사·입주 청소 시즌이라면 센서등부터 갈아두세요. 짐 나르는 날 현관을 가장 많이 드나들게 되는데, 그때 새 센서등의 진가를 바로 느끼게 되실 거예요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 현관/센서등 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=010\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-th-aircon","topic":"실링팬 영업(광고 맞음)","format":"스레드","channels":["threads"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"VITTZ 빛 수다","headline":"실링팬 영업(광고 맞음)","sub":"직원 자아 페르소나 — 반말 수다 톤","dayLabel":"쓰레드","captionNote":"쓰레드 레퍼런스 학습 반영: 직원 자아(스픽)·혼용률 공개 메타(WCONCEPT)·말걸기/이모지 불릿(29CM)·상담 포맷. 광고는 광고라고 밝히는 티키타카.","captionBody":"에어컨 28도 + 실링팬 조합으로 자면\n26도 혼자 돌릴 때보다 시원하다는 거, 회사 와서 처음 앎\n\n찬 공기는 바닥에 깔려있는데 그걸 천장에서 저어주는 원리\n국 끓일 때 젓는 거랑 똑같음\n\n참고로 우리 실링팬은 방등 자리에 그대로 달림 (타공 없음)\n이건 광고 맞음. 근데 진심인 광고임","status":"planned"},{"id":"w2-ig-stay","topic":"식탁에 머무는 시간","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"비츠 · 홈카페","headline":"밥만 먹고 일어나는 *식탁*,\u003cbr>등 때문일 수 있어요","sub":"가족이 머무는 식탁의 비밀","dayLabel":"인스타그램","cardImage":"cards/vittz/w2-ig-stay-1.png","captionNote":"컷 로테이션 seraphim 0→2. 공간 키워드 강조(식탁·테이블·식탁 위).","captionBody":"카페에선 2시간도 앉아 있는데 우리 집 식탁은 왜 10분일까요.\n\n답은 빛의 높이였어요. 식탁 위 60~80cm까지 낮게 내려온 빛이 테이블을 감싸면, 그 자리가 아늑한 방이 됩니 계로 저녁 8시 이후엔 거실 천장등을 끄기로 했어요. 대신 식탁 위 세라핌 유리 펜던트를 켜요. 유리 결을 타고 퍼지는 노란빛이 테이블 주변을 카페 테이블처럼 만들어줘요.\n\n2단계로 벽엔 젤로비 레일 스팟을 달아 그림 한 점을 비췄어요. 벽에 빛이 흐르니 낮엔 밋밋했던 벽이 밤엔 갤러리가 돼요.\n\n3단계, 그제야 무드등이 살아났어요. 소파 옆 협탁에 둔 작은 무드등이 세 번째 빛으로 제 몫을 하더라고요. 주인공이 아니라 앙상블의 한 명이 되니까요.\n\n## 무드 조명 초보가 자주 묻는 것들\n\n**Q. 뭐부터 사야 해요?**\n새로 사기 전에 오늘 밤 천장등부터 꺼보세요. 그리고 집에 있는 스탠드나 펜던트 하나만 켜보는 거예요. 우리 집에 어떤 빛이 부족한지 그때 보여요.\n\n**Q. 빛 색은 통일해야 하나요?**\n저녁 조명은 전구색(따뜻한 노란빛)으로 통일하는 걸 추천해요. 노란빛과 흰빛이 섞이면 이도 저도 아닌 어정쩡한 공간이 되더라고요.\n\n**Q. 전기요금 걱정돼요.**\nLED 기준으로 펜던트+스팟+무드등을 저녁 내내 켜도 거실 천장등 하나보다 적게 먹는 조합이 충분히 가능해요. 오히려 큰 등을 끄는 시간이 늘어서 이득이었어요.\n\n## 오늘 밤 해볼 수 있는 것\n\n거창하게 시작할 필요 없어요. 오늘 밤 8시, 거실 천장등을 끄고 작은 등 하나만 켜보세요. 가족들 반응이 답을 알려줄 거예요. 저희 집은 그날 남편이 \"우리 집 되게 좋다\"라고 했어요. 5년 만에 처음요.\n\n## 평수별로 간단히 정리하면\n\n- **원룸·오피스텔**: 천장등 + 침대 옆 무드등, 딱 두 개면 돼요. 저녁엔 무드등만.\n- **20평대**: 거실 천장등 + 식탁 펜던트 + 무드등 하나. 저녁의 주인공은 펜던트예요.\n- **30평대 이상**: 여기에 벽 스팟(레일)을 더하면 완성. 손님 오는 날 진가가 나와요.\n\n한 번에 다 갖출 필요 없어요. 저도 1년에 걸쳐 하나씩 늘렸어요. 조명은 가구와 달리 하나 더할 때마다 집이 눈에 띄게 달라져서, 늘려가는 재미가 있는 품목이에요.\n\n## 흔한 실수 하나만 짚을게요\n\n무드 조명을 '어두운 조명'으로 오해하는 거예요. 무드는 어두운 게 아니라 필요한 곳만 밝은 상태예요. 테이블 위는 책을 읽을 만큼 밝고, 나머지가 은은한 것. 그래서 무드를 만들고도 생활이 전혀 불편하지 않아요. 오히려 눈은 더 편해지고요.\n\n참, 콘센트 자리도 미리 봐두세요. 무드등과 스탠드는 결국 콘센트 근처에 살게 되거든요. 멀티탭이 보이면 무드가 깨지니까, 가구 뒤로 선을 숨길 수 있는 자리를 먼저 찾고 등을 두는 게 순서예요.\n\n빛이 세 자리로 나뉜 집은 사진도 잘 나와요. 손님들이 \"집이 왜 이렇게 아늑해요?\"라고 물으면, 이제 대답해 주세요. 등을 더 산 게 아니라 빛의 자리를 나눴을 뿐이라고요.\n\n![](products/vittz/seraphim-2.jpg)\n\n---\n**이 글에서 소개한 제품**\n- 세라핌 1등 인테리어 식탁등 → https://vittz.co.kr/shop/shopdetail.html?branduid=1100003357\n- COB 젤로비 레일조명 → https://vittz.co.kr/shop/shopdetail.html?branduid=2081318\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-mood","topic":"무드등 수면 루틴","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-13T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"잠드는 스위치, *무드등* 루틴","sub":"핵심 키워드: 무드등 (월간 21,240회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-mood/cover.png","captionNote":"핵심 키워드 무드등 21,240 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2079자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 잠들기 전 30분, 무드등 하나로 수면 루틴 만든 후기\n\n결론부터요. 밤마다 침대에서 휴대폰을 놓지 못하던 제가, 무드등 하나로 '잠드는 스위치'를 만들었어요. 방법은 딱 하나 — 잘 준비가 되면 방등을 끄고 무드등만 켜는 거예요. 가볍게 공유할게요.\n\n![](blog/w2-gb-mood/scene-1.jpg)\n\n## 우리 몸은 빛으로 시간을 읽어요\n\n밤에 천장의 하얀 불빛을 쬐면 몸은 아직 낮이라고 착각한대요. 그래서 밝은 방에서 눕자마자 잠들기가 어려운 거예요. 반대로 낮은 곳에서 퍼지는 따뜻한 노란빛은 몸에게 '이제 저녁이야'라고 알려주는 신호가 돼요. 캠프파이어 앞에서 나른해지는 그 느낌이요.\n\n무드등은 예쁜 소품이기 전에, 몸의 시계를 저녁으로 돌려주는 리모컨인 셈이에요.\n\n![](blog/w2-gb-mood/fig-1.png)\n\n## 제가 만든 30분 루틴\n\n1. 밤 10시 반, 방등을 끄고 침대 옆 무드등만 켜요.\n2. 폰은 무드등 옆에 엎어둬요. (빛이 약하면 신기하게 폰 생각도 줄어요)\n3. 책 몇 장 읽다가 스르르.\n\n처음 3일은 어색했는데, 일주일 지나니 무드등을 켜는 순간 하품이 나오기 시작했어요. 몸이 빛을 기억하더라고요.\n\n## 무드등 고를 때 팁 세 가지\n\n- **빛 색은 무조건 전구색(노란빛)** — 하얀빛 무드등은 반쪽짜리예요.\n- **밝기 조절 되는 걸로** — 책 읽을 땐 2단, 잠들기 직전엔 1단.\n- **손 닿는 곳에** — 침대에서 팔 뻗어 끌 수 있어야 루틴이 완성돼요.\n\n## 아이 방에도 통해요\n\n아이들은 어둠을 무서워하지만, 사실 무서운 건 '갑자기 캄캄해지는 것'이에요. 방등에서 무드등으로, 빛을 한 단계씩 줄여주면 아이도 자연스럽게 잘 준비를 해요. 저희 집은 \"무드등 켜자\"가 \"이제 자자\"의 다정한 버전이 됐어요.\n\n## 오늘의 요약\n\n- 밤의 하얀 천장빛은 몸을 낮으로 착각하게 함\n- 잘 준비 = 방등 끄고, 낮고 따뜻한 빛 하나만\n- 전구색 · 밝기 조절 · 손 닿는 위치, 세 가지만 기억\n- 일주일이면 몸이 빛을 기억해요\n\n## 무드등, 침실 밖에서도 일해요\n\n**거실 소파 옆**에 두면 TV 볼 때 눈이 편해요. 캄캄한 방에서 TV만 켜면 화면과 어둠의 대비가 커서 눈이 쉽게 피로해지거든요. 뒤쪽에 은은한 무드등 하나가 그 대비를 줄여줘요.\n\n**식탁 위 선반**에 두면 야식 무드가 완성돼요. 라면도 무드등 아래에선 근사한 야식이 됩니다.\n\n**현관 콘솔 위**도 좋아요. 밤늦게 귀가하는 가족을 위해 켜두는 작은 불 — 실용을 넘어 마음이 담기는 자리예요.\n\n## 이런 건 피하세요\n\n- 화면 바로 옆의 강한 무드등 — 반사돼서 오히려 방해돼요.\n- 침대 머리맡의 '올려다보는' 위치 — 누웠을 때 광원이 직접 보이면 눈부셔요. 눈높이 아래, 빛이 벽이나 협탁을 향하게 두세요.\n- 충전 알림등이 깜빡이는 제품 — 애써 만든 어둠을 그 작은 LED가 다 망쳐요.\n\n결국 무드등의 핵심은 '빛을 직접 보지 않고, 빛이 닿은 곳을 보는 것'이에요. 이 한 줄만 기억하시면 어디에 두든 실패하지 않아요.\n\n## 한 달 루틴 후기, 숫자로\n\n잠들기까지 걸리는 시간(폰 기준 마지막 사용~수면 시작)이 평균 40분대에서 20분대로 줄었어요. 새벽에 깨서 폰 보는 날도 줄었고요. 무드등 하나가 한 일 치고는 과분한 성적표죠. 수면 앱이나 영양제보다 먼저, 침실의 빛부터 바꿔보시라고 말씀드리고 싶어요. 시작 비용도 제일 저렴하니까요.\n\n참, 무드등 타이머 기능이 있는 제품이면 한 단계 더 편해져요. 30분 뒤 자동으로 꺼지게 해두면, 책 읽다 잠들어도 아침까지 켜져 있을 걱정이 없어요. 저는 타이머를 '독서 마감시간'으로도 써요. 불이 꺼지면 오늘은 여기까지, 하고 눈을 감는 거죠.\n\n오늘 밤, 방등 스위치 대신 무드등 스위치에 손이 가는 작은 변화부터 시작해 보세요. 루틴은 거창한 결심이 아니라 손이 기억하는 순서더라고요.\n\n그리고 이 루틴의 숨은 보너스 — 무드등 아래에서는 침실 사진이 참 예쁘게 나와요. 호텔 침실 느낌의 그 사진, 필터가 아니라 조명이 만드는 거였더라고요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 스탠드/무드등 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=011\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-th-myhome","topic":"직원의 자취방 공개","format":"스레드","channels":["threads"],"scheduledFor":"2026-08-13T09:00:00.000Z","kicker":"VITTZ 빛 수다","headline":"직원의 자취방 공개","sub":"직원 자아 페르소나 — 반말 수다 톤","dayLabel":"쓰레드","captionNote":"쓰레드 레퍼런스 학습 반영: 직원 자아(스픽)·혼용률 공개 메타(WCONCEPT)·말걸기/이모지 불릿(29CM)·상담 포맷. 광고는 광고라고 밝히는 티키타카.","captionBody":"조명 회사 다니면 집이 쇼룸일 거라고들 생각하는데\n\n실화: 나 입사 전까지 형광등 하나로 살았음\n입사하고 제일 먼저 바꾼 건 침대 옆 무드등\n그 다음이 식탁 펜던트\n\n큰 등 끄고 작은 빛 두 개만 켜는 순간\n자취방도 '집'이 되더라\n\n너네는 집에 빛 몇 개야? (천장등 제외)","status":"planned"},{"id":"w2-ig-gallery","topic":"벽 갤러리 만들기","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-13T09:00:00.000Z","kicker":"비츠 · 빛의 기술","headline":"그림을 바꿨는데\u003cbr>왜 *벽*은 그대로일까","sub":"밋밋한 벽을 갤러리로 만드는 빛","dayLabel":"인스타그램","cardImage":"cards/vittz/w2-ig-gallery-1.png","captionNote":"공간 키워드 강조(벽). jelrobi 컷 로테이션.","captionBody":"그림을 바꿔도 벽이 밋밋했던 이유 — 빛이 정면에서만 오고 있었기 때문이에요.\n\n갤러리처럼 빛을 벽에 비스듬히 흘려보세요(월 워싱). 벽의 질감이 살아나며 낮과 밤의 얼굴이 달라집니다.\n\nCOB 젤로비 레일조명 — 스팟 하나씩 더하고, 방향은 언제든 다시.\n제품은 프로필 링크에서 👉 @vittz_official\n\n#비츠조명 #레일조명 #레일등 #월워싱 #거실인테리어 #카페인테리어 #집꾸미기 #비츠","slideImages":["cards/vittz/w2-ig-gallery-1.png","cards/vittz/w2-ig-gallery-2.png","cards/vittz/w2-ig-gallery-3.png","cards/vittz/w2-ig-gallery-4.png","cards/vittz/w2-ig-gallery-5.png"],"status":"planned"},{"id":"w2-yt-lightorder","topic":"불 켜는 순서","format":"쇼츠","channels":["youtube"],"scheduledFor":"2026-08-13T09:00:00.000Z","kicker":"VITTZ 조명 레시피","headline":"카페 같은 집, *불 켜는 순서*가 있습니다","sub":"저녁 조명 3단계 — 신규 씬·새 편집 문법(v2)","dayLabel":"쇼츠","cardImage":"shorts/w2-yt-lightorder/cover.png","captionNote":"[v2 재제작 2026-08 요.\n\n**둘째, 확산형인지.** 빛이 부드럽게 퍼지는 확산형이 집엔 편해요. 한 점을 쏘는 집중형은 그림 비출 때만 쓰고요.\n\n**셋째, 개수 계획.** 다운라이트는 하나하나는 약하고 여러 개가 모여 일해요. 도배·공사 때 한 번에 계획하는 게 나중에 천장을 또 뚫는 것보다 훨씬 깔끔해요.\n\n## 자주 묻는 질문\n\n**Q. 전구만 갈 수 있나요?**\n요즘 LED 다운라이트는 일체형이 많아요. 수명이 다하면 등 자체를 바꾸는 방식인데, 교체가 간단하고 가격도 부담 없는 편이에요.\n\n**Q. 몇 개나 달아야 해요?**\n복도는 1~1.5m 간격, 거실 보조용은 소파·테이블 위주로 4~6개가 일반적이에요. 공간 사진을 들고 상담받으면 개수를 잡아줘요.\n\n**Q. 셀프 시공 가능한가요?**\n천장 배선을 만지는 일이라 전기 작업이 익숙하지 않다면 시공을 맡기시길 권해요. 비츠는 무료 출장 컨설팅과 설치 서비스가 있어서, 저는 개수 계획부터 상담으로 잡았어요.\n\n## 마무리\n\n다운라이트는 화려한 주인공이 아니에요. 하지만 잘 심어둔 다운라이트는 집을 조용히 넓혀줘요. 이사나 리모델링을 앞두고 계시다면, 벽지 고르기 전에 천장 계획부터 세워보세요. 순서만 바꿔도 결과가 달라져요.\n\n## 저희 집 적용기 — 복도 4개, 거실 6개\n\n저희 집은 리모델링 때 복도에 4개, 거실 소파 라인에 6개를 심었어요. 복도는 1.2m 간격으로 일렬, 거실은 소파와 테이블 위주로 두 줄. 공사 전엔 '너무 많나?' 싶었는데, 살아보니 이 개수가 딱이에요. 전부 켜는 날은 거의 없고, 그날 기분 따라 절반만 켜거든요. 다운라이트는 여러 개를 심되 나눠 켜는 게 운영의 묘예요.\n\n스위치를 두 개 회로로 나눈 것도 잘한 선택이었어요. 복도 스위치 하나, 거실 스위치 하나. 이걸 한 회로로 묶으면 전부 켜거나 전부 꺼야 해서 무드 조절이 안 돼요. 공사 전에 꼭 회로 분리를 요청하세요.\n\n## 마지막 당부\n\n다운라이트는 '심는 등'이라 되돌리기가 번거로워요. 그래서 더더욱 계획이 절반이에요. 사진 몇 장 들고 무료 출장 컨설팅부터 받아보시길 — 저는 그 상담 30분이 공사비 몇십만 원을 아껴줬다고 생각해요.\n\n참고로 다운라이트 빛 색도 공간 따라 나누면 좋아요. 복도·현관은 손님맞이 느낌의 전구색, 주방 작업 구간은 또렷한 주백색. 같은 다운라이트라도 색만 나누면 공간의 역할이 분명해져요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 매입/다운라이트 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=006\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-bulb","topic":"LED 전구 고르기","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-14T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"*LED 전구*, 숫자 두 개면 끝","sub":"핵심 키워드: LED전구 (월간 10,860회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-bulb/cover.png","captionNote":"핵심 키워드 LED전구 10,860 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2035자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# LED 전구 살 때 숫자 두 개만 보면 실패 없어요\n\n결론부터요. 전구 고를 때 볼 건 딱 두 숫자 — 소켓 규격(E26/E14)과 색온도(K)예요. 이 둘만 맞으면 나머지는 취향이에요. 마트 전구 코너에서 20분 서성이던 과거의 저에게 알려주고 싶은 내용, 가볍게 정리했어요.\n\n## 첫 번째 숫자: E26이냐 E14냐\n\n전구 돌려 끼우는 부분(소켓)의 지름이에요. E26은 어른 엄지손가락 굵기의 표준 소켓, E14는 새끼손가락 굵기의 가는 소켓이에요. 국내 조명 대부분은 E26이고, 유럽풍 샹들리에나 작은 스탠드가 E14인 경우가 많아요.\n\n헷갈리면 다 쓴 전구를 들고 가거나, 소켓 사진을 찍어 가세요. 이거 하나면 반품 왕복 택배비를 아껴요.\n\n![](blog/w2-gb-bulb/fig-1.png)\n\n## 두 번째 숫자: 색온도 K\n\n- **3000K 전구색** — 노랗고 따뜻한 빛. 침실, 식탁, 무드 조명용.\n- **4000K 주백색** — 아이보리빛. 어디에나 무난한 중간값.\n- **5700K 주광색** — 하얗고 쨍한 빛. 공부방, 드레스룸, 주방 작업등용.\n\n비유하자면 3000K는 카페, 4000K는 우리 집 낮, 5700K는 편의점이에요. 켜질 공간에서 뭘 하는지 떠올리면 답이 나와요.\n\n## 와트가 아니라 루멘을 보세요\n\n옛날 백열전구 시절엔 와트(W)가 밝기였는데, LED는 와트가 '전기 먹는 양'일 뿐이에요. 밝기는 루멘(lm)으로 봐요. 백열 60W를 쓰던 자리라면 LED는 800lm 정도(소비전력은 8~10W)면 같은 밝기예요. 전기는 6분의 1만 먹고요.\n\n## 에디슨 전구는 언제 쓰나요\n\n필라멘트가 보이는 그 감성 전구요. 빛이 세지 않아서 메인 조명으론 아쉽고, 노출형 펜던트나 벽등에 끼워 '보여주는 빛'으로 쓰는 게 정답이에요. 카페 창가의 그 분위기가 바로 에디슨 전구예요.\n\n## 오늘의 요약\n\n- 소켓(E26/E14)과 색온도(K), 두 숫자만 맞추면 실패 없음\n- 밝기는 와트 말고 루멘 — 백열 60W ≈ LED 800lm\n- 3000K는 카페, 4000K는 낮, 5700K는 편의점\n- 에디슨 전구는 노출형 조명에 '보여주는 빛'으로\n\n## 자주 하는 실수 두 가지\n\n**밝기가 아쉬워서 아무 전구나 더 센 걸 끼우는 것.** 등기구마다 정격 와트 상한이 있어요. 상한보다 센 전구를 끼우면 열이 쌓여서 등도 전구도 수명이 짧아져요. 등기구에 적힌 최대 와트를 꼭 확인하세요.\n\n**조광(밝기 조절) 스위치에 일반 전구를 끼우는 것.** 밝기 조절 기능이 있는 조명엔 '디머블(조광용)' 표시가 있는 전구를 써야 해요. 일반 전구를 끼우면 지지직거리거나 깜빡여요.\n\n## 전구 바꾸기 좋은 날\n\n전구는 몰아서 바꾸는 게 이득이에요. 하나 나갔을 때 같은 시기에 끼운 전구들도 수명이 비슷하게 남았을 확률이 높거든요. 저는 연말 대청소 날을 '전구 점검의 날'로 정해두고, 색온도도 그때 계절에 맞게 정리해요. 소켓 규격을 메모장에 적어두면(우리 집 식탁등 E26, 스탠드 E14…) 다음 구매가 30초로 끝나요.\n\n## 오늘 집에 가서 해볼 것\n\n집 안 전구 소켓들을 폰으로 한 바퀴 찍어두세요. 딱 5분이면 돼요. 그 사진첩이 앞으로 몇 년간 전구 코너에서 서성일 시간을 다 아껴줍니다. 그리고 다음에 전구가 나가면, 오늘 배운 두 숫자만 기억하세요. 소켓 규격과 색온도. 이 글이 그때 떠오른다면 성공이에요.\n\n하나 더, 전구 색이 섞여 보이는 집이라면 오늘이 정리할 기회예요. 거실 등은 노란데 스탠드는 하얗고, 주방은 푸르스름하고… 색온도가 뒤섞이면 집이 어수선해 보여요. 전구를 점검하는 날, 공간별로 색온도를 통일해 주세요. 돈 안 드는 인테리어 중 효과 1등이에요.\n\n전구는 작지만 집 안에서 가장 자주 갈게 되는 소모품이에요. 오늘 정리해 둔 두 숫자가 앞으로 몇 년을 편하게 해줄 거예요.\n\n참, 남은 전구는 상자에 '구매일과 색온도'를 적어 보관하세요. 다음 교체 때 그 메모 하나가 큰 도움이 돼요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 전구 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=012\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","s 뉴스","channels":["instagram"],"scheduledFor":"2026-08-15T09:00:00.000Z","kicker":"비츠 이야기","headline":"조명은 *다는 것*까지가\u003cbr>조명입니다","sub":"비츠 딜리버리가 있는 이유","dayLabel":"인스타그램","cardImage":"cards/vittz/w2-ig-delivery-1.png","captionNote":"brand-story 테마(타이포 네이비). 흰 박스 강조 문법.","captionBody":"\"예쁜 건 알겠는데 누가 달아줘요?\"\n\n조명 바꾸기를 망설이게 하는 건 제품이 아니라 사다리였어요.\n그래서 비츠는 배달과 설치를 한 번에 해결합니다 — 비츠 딜리버리.\n\n설치 걱정에 미뤄온 조명이 있다면, 지금이에요.\n@vittz_official\n\n#비츠 #비츠조명 #비츠딜리버리 #조명설치 #인테리어조명 #브랜드스토리","slideImages":["cards/vittz/w2-ig-delivery-1.png","cards/vittz/w2-ig-delivery-2.png","cards/vittz/w2-ig-delivery-3.png","cards/vittz/w2-ig-delivery-4.png"],"status":"planned"}],"channels":[{"key":"instagram","label":"인스타그램","icon":"📸","active":true,"published":[],"pending":[{"id":"test-ig-ceilingfan","topic":"실링팬","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-03T09:00:00.000Z","kicker":"비츠 · 여름 시선","headline":"에어컨만으론 부족한 밤,\u003cbr>*실링팬*이 답일까요?","sub":"우리 집은 어느 쪽인가요 — 댓글로 알려주세요. 실링팬파 🙋 서큘레이터파 🙌","dayLabel":"여름 시선 · 시의성","cardImage":"cards/vittz/test-ig-ceilingfan-1.png","captionNote":"시의성(여름 피크 7~8월, 데이터랩 실링팬 지수 100) 큐레이션. 첫 장 투표형 인터랙션.","captionBody":"열대야에 에어컨 설정온도만 계속 내리고 계신가요? 🌙\n\n찬 공기는 바닥에, 더운 공기는 천장에 — 방 안 공기가 섞이지 않으면 설정온도를 아무리 내려도 시원하지 않아요.\n\n해결은 바람이 아니라 공기 순환입니다.\n천장에서 방 전체 공기를 크게 돌리면 설정온도를 2~3도 올려도 시원하고, 냉방비도 가벼워져요.\n\nLED 블레이드 실링팬 조명은 방등 자리에 그대로 설치하는 조명+팬 결합형이라 타공 걱정이 없고, 겨울엔 역풍 모드로 난방 효율까지 챙기는 사계절 가전이에요.\n\n우리 집 여름 공기 담당, 실링팬파 🙋 vs 서큘레이터파 🙌 — 댓글로 알려주세요!\n설치가 걱정이라면 비츠 딜리버리(배달+설치 한 번에)로 해결하세요. 제품은 프로필 링크에서 👉 @vittz_official\n\n#실링팬 #실링팬조명 #천장선풍기 #여름인테리어 #냉방비절약 #비츠조명 #인테리어조명 #집꾸미기 #비츠","slideImages":["cards/vittz/test-ig-ceilingfan-1.png","cards/vittz/test-ig-ceilingfan-2.png","cards/vittz/test-ig-ceilingfan-3.png","cards/vittz/test-ig-ceilingfan-4.png","cards/vittz/test-ig-ceilingfan-5.png"],"status":"planned"},{"id":"test-ig-standard60","topic":"LED 방등","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-04T09:00:00.000Z","kicker":"비츠 · 제품 노트","headline":"여러분 방등,\u003cbr>몇 년째 *그대로*인가요?","sub":"5년 넘었다면 오늘 카드를 저장해 두세요 — 1만원대로 끝나는 이야기입니다.","dayLabel":"제품 노트 · 디테일","cardImage":"cards/vittz/test-ig-standard60-1.png","captionNote":"제품 개별 디테일 화법(스탠다드 60W). 첫 장 연차 질문 인터랙션 + 저장 유도.","captionBody":"어느 날부터 방이 좀 침침하다고 느낀 적 있나요? 💡\n\n눈이 나빠진 게 아니라 조명이 늙은 것일 수 있어요. LED도 시간이 지나면 밝기가 서서히 줄고, 커버는 누렇게 변합니다.\n\n방등 교체 신호 3가지\n· 커버가 누렇게 변색됐다\n· 켤 때 잠깐 깜빡인다\n· 예전보다 확실히 어둡다\n\n하나라도 해당된다면 교체 타이밍이에요. 델룬 방등은 표준 사이즈라 기존 자리에 그대로 달 수 있고, 삼성 정품 LED 모듈에 플리커프리라 눈이 편해요.\n\n우리 집 방등 연차, 댓글로 알려주세요 🙋\n교체가 걱정이라면 비츠 딜리버리(배달+설치 한 번에)로 해결하세요. 제품은 프로필 링크에서 👉 @vittz_official\n\n#방등 #방등교체 #LED방등 #셀프인테리어 #침실조명 #비츠조명 #인테리어조명 #집꾸미기 #비츠","slideImages":["cards/vittz/test-ig-standard60-1.png","cards/vittz/test-ig-standard60-2.png","cards/vittz/test-ig-standard60-3.png","cards/vittz/test-ig-standard60-4.png","cards/vittz/test-ig-standard60-5.png"],"status":"planned"},{"id":"test-ig-3lights","topic":"조명 레이어링","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-05T09:00:00.000Z","kicker":"비츠 · 조명 레시피","headline":"*거실*이 *카페*처럼\u003cbr>보이는 집,\u003cbr>조명 3개가 다릅니다","sub":"저장해두고 이사·새단장 때 꺼내보세요","dayLabel":"조명 레시피 · 큐레이션","cardImage":"cards/vittz/test-ig-3lights-1.png","captionNote":"레퍼런스 학습 반영: 공간별 큐레이션+넘버링 소제목+가격 명시+저장 유도 클로징(지침 캐러셀 규약). 3광원(베이스·포인트·무드) 공식 — 제품 3종 구매 동선.","captionBody":"똑같은 소파, 똑같은 가구인데 어떤 집 거실은 카페 같아 보이죠 ☕\n\n비밀은 가구가 아니라 빛의 개수입니다. 천장등 하나로 모든 빛을 해결하면 공간이 평평해 보여요. 빛을 세 방향으로 나눠보세요.\n\n거실이 카페가 되는 3광원 공식\n① 베이스 조명 — 눈이 편한 기본 밝기\n   · LED 델룬 거실등 180W (삼성 정품 모듈·플리커프리) — 95,000원\n② 포인트 조명 — 소파 옆·그림 위를 겨냥해 음영 만들기\n   · COB 젤로비 레일조명 (스팟 1개씩 추가 가능) — 13,000원~\n③ 무드 조명 — 웜톤 한 점이 분위기를 완성\n   · 세라핌 컬러 글라스 식탁등 — 75,000원\n\n오늘 하나만 더해도 거실 분위기가 달라집니다.\n댓글로 알려주세요 — 우리 집에 없는 광원은 몇 번인가요? 1️⃣2️⃣3️⃣\n\n설치가 걱정이라면 비츠 딜리버리(배달+설치 한 번에)로 해결하세요.\n제품은 프로필 링크에서 👉 @vittz_official\n\n#비츠조명 #거실조명 #조명인테리어 #거실등 #레일조명 #식탁등 #펜던트조명 #조명추천 #집꾸미기 #카페같은집 #신혼집인테리어 #비츠","slideImages":["cards/vittz/test-ig-3lights-1.png","cards/vittz/test-ig-3lights-2.png","cards/vittz/test-ig-3lights-3.p  가이드","headline":"실링팬, 에어컨 옆 *천장*의 반전","sub":"핵심 키워드: 실링팬 (월간 81,300회)","dayLabel":"네이버 블로그","cardImage":"blog/w2-nb-fan/cover.png","captionNote":"핵심 키워드 실링팬 81,300 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2175자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 실링팬, 에어컨 옆에 달아만 놨는데 전기요금이 달라졌어요\n\n결론부터 말씀드릴게요. 올여름 저희 집 냉방비를 줄여준 건 에어컨이 아니라 천장에 단 실링팬이었어요. 에어컨 설정온도를 26도에서 28도로 올렸는데도 체감은 더 시원했고, 한 달 전기요금이 눈에 띄게 가벼워졌거든요. 오늘은 '실링팬이 처음이라' 막막하신 분들을 위해, 제가 직접 겪은 순서 그대로 풀어드릴게요.\n\n![](blog/w2-nb-fan/scene-1.jpg)\n\n## 실링팬이 뭐길래 시원해질까요?\n\n작년 여름 저희 집 거실은 참 이상했어요. 에어컨 바로 앞은 춥고, 식탁 쪽은 후덥지근하고요. 알고 보니 찬 공기는 무거워서 바닥에 깔리고, 더운 공기는 천장에 떠 있는 거였어요. 방 안 공기가 물과 기름처럼 층층이 나뉘어 있던 거죠.\n\n실링팬은 이 층을 크게 저어주는 국자 같은 역할을 해요. 천장에서 방 전체 공기를 한 번에 크게 돌려주니까, 에어컨 냉기가 구석구석 골고루 퍼지는 거예요. 선풍기처럼 한 방향으로 바람을 쏘는 게 아니라, 방 전체의 공기를 섞어준다는 게 핵심이에요.\n\n![](blog/w2-nb-fan/fig-1.png)\n\n## 그런데 왜 하필 '조명 일체형'이었냐면요\n\n실링팬을 알아보다가 저를 멈칫하게 한 게 천장 타공이었어요. 남의 집도 아니고 우리 집 천장에 구멍을 새로 뚫는다니, 겁이 나더라고요.\n\n그러다 찾은 답이 조명 일체형 실링팬이었어요. 지금 쓰는 방등·거실등을 떼어낸 그 자리에, 조명과 팬이 하나로 된 제품을 그대로 다는 방식이에요. 저는 비츠의 LED 블레이드 실링팬 조명으로 바꿨는데, 기존 등 자리에 설치하니 타공이 필요 없었어요. 낮에는 조명으로, 더울 땐 팬으로, 하나가 두 몫을 해요.\n\n## 한 달 써보니 이게 달라졌어요\n\n첫째, 에어컨 설정온도를 2도 올렸어요. 공기가 순환되니 28도여도 26도처럼 느껴지더라고요. 에어컨은 설정온도를 1도만 올려도 소비 전력이 꽤 줄어든다고 하죠.\n\n둘째, 소리가 조용해요. BLDC 모터라 밤에 아기 재울 때 틀어도 선풍기보다 조용했어요. 도서관에서 책장 넘기는 소리 정도랄까요.\n\n셋째, 겨울에도 쓸 수 있대요. 날개를 반대로 돌리는 역회전 모드로 천장의 따뜻한 공기를 아래로 내려준다고 해서, 사계절 가전으로 쓸 생각이에요.\n\n## 처음이라면 이 세 가지만 확인하세요\n\n1. 우리 집 천장 등 자리에 다는 '조명 일체형'인지 (타공 걱정 끝)\n2. BLDC 모터인지 (소음·전기요금 차이가 커요)\n3. 설치를 맡길 수 있는지 — 비츠는 배달과 설치를 한 번에 해주는 딜리버리가 있어서 저는 주문만 했어요.\n\n여름마다 에어컨 리모컨과 씨름하셨다면, 올해는 천장을 한번 올려다보세요. 등 하나 바꾸는 일로 여름 공기가 달라질 수 있어요.\n\n## 자주 묻는 질문, 제가 겪은 그대로 답해요\n\n**Q. 실링팬 돌리면 에어컨 없이도 시원한가요?**\n한여름 낮엔 솔직히 에어컨이 필요해요. 다만 실링팬을 같이 돌리면 에어컨이 훨씬 여유롭게 일해요. 저희 집은 열대야에 에어컨 28도+실링팬 조합으로 잤는데, 이불을 찾게 되더라고요. 초여름과 초가을엔 실링팬만으로 충분했고요.\n\n**Q. 천장이 낮은 아파트인데 괜찮을까요?**\n저희 집도 평범한 아파트 천장(2.3m 정도)이에요. 조명 일체형은 기존 방등처럼 천장에 붙는 형태라 머리 위 공간을 거의 잡아먹지 않아요. 식탁 의자에 올라서도 손이 안 닿는 높이예요.\n\n**Q. 바람 소리에 예민한 편인데요.**\n저도 그래요. 그래서 BLDC 모터를 고집했어요. 1단으로 돌리면 공기가 움직이는 게 느껴지는데 소리는 안 들려요. 자다가 깬 적이 한 번도 없어요.\n\n**Q. 청소는 어떻게 하나요?**\n계절 바뀔 때 날개를 마른 천으로 한 번 닦아주는 게 전부였어요. 날개가 천장 가까이 있어서 생각보다 먼지가 덜 쌓이더라고요.\n\n## 여름이 오기 전에 준비하면 좋은 이유\n\n실링팬은 이상하게 더위가 시작되면 품절이 잦아요. 작년에 7월에 알아봤다가 설치까지 2주를 기다렸거든요. 올해는 6월에 미리 달아뒀더니 첫 폭염부터 여유로웠어요. 에어컨처럼 큰돈 드는 공사가 아니라, 등 하나 바꾸는 마음으로 시작할 수 있다는 것. 그게 제가 실링팬을 주변에 권하는 이유예요.\n\n![](products/vittz/blade.jpg)\n\n---\n**이 글에서 소개한 제품**\n- LED 블레이드 BLDC 천장 실링팬 조명 → https://vittz.co.kr/shop/shopdetail.html?branduid=1100006949\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-nb-dining","topic":"식탁등","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-11T09:00:00.000Z","kicker":"VITTZ 조명 가이드","headline":"*식탁등* 하나로 집에서 카페 하는 법","sub":"핵심 키워드: 식탁등 (월간 17,820회)","dayLabel":"네이버 블로그","cardImage":"blog/w2-nb-dining/cover.png","captionNote":"핵심 키워드 식탁등 17,820 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2208자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 식탁등 하나 바꿨을 뿐인데, 저녁마다 집에서 카페 하고 있어요\n\n먼저 결론이요. 저희 집 저녁 풍경을 바꾼 건 소파도 원목 테이블도 아니고, 식탁 위에 매단 등 하나였어요. 식탁등을 유리 펜던트로 바꾼 날부터 남편이 퇴근하면 식탁에 앉아요. 예전엔 밥만 먹고 소파로 직행했거든요. 오늘은 그 얘기를 들려드릴게요.\n\n![](blog/w2-nb-dining/scene-1.jpg)\n\n## 우리 집 식탁이 창고 같았던 이유\n\n이사 왔을 때 식탁 위엔 천장에 붙는 네모난 등이 있었어요. 밝기는 충분한데, 이상하게 식탁에 앉으면 사무실 같았어요. 카페에서는 두 시간도 앉아 있으면서 왜 우리 집 식탁은 10분 만에 일어나게 될까, 한참 생각했어요.\n\n답은 빛의 높이였어요. 카페 조명은 테이블 가까이 낮게 내려와 있잖아요. 빛이 얼굴과 테이블 주변만 감싸니까 그 자리가 아늑한 방처럼 느껴지는 거예요. 천장에서 방 전체를 환하게 비추는 빛은 '업무용', 낮게 내려와 테이블만 비추는 빛은 '머무는 용'이더라고요.\n\n![](blog/w2-nb-dining/fig-1.png)\n\n## 유리 펜던트를 고른 날\n\n그래서 식탁등을 알아보다가 비츠의 세라핌 인테리어 식탁등을 골랐어요. 컬러 유리 안에 전구가 들어 있는 펜던트인데, 처음엔 '유리가 너무 튀지 않을까' 걱정했어요.\n\n그런데 실물은 반대였어요. 불을 안 켠 낮에는 식탁 위에 떠 있는 유리 오브제 같고, 저녁에 불을 켜면 유리 결을 따라 빛이 퍼지면서 테이블 위에 동그란 빛 웅덩이가 생겨요. 사탕 유리병 안에 촛불을 켠 듯한 느낌이라고 하면 비슷할까요.\n\n## 달고 나서 달라진 저녁\n\n설치한 첫 주에 벌써 습관이 바뀌었어요. 밥을 먹고 나서도 식탁에 그대로 앉아 과일을 깎고, 아이 숙제도 식탁에서 봐요. 주말 밤엔 남편과 식탁에서 맥주 한 캔을 마시는데, 거실 등을 다 끄고 펜던트만 켜면 정말 우리 집이 조용한 카페가 돼요.\n\n포인트는 밝기 조절이 아니라 '빛의 범위'였어요. 온 집을 밝히지 않고 식탁 위 1미터만 밝히는 것. 그게 카페 무드의 전부더라고요.\n\n## 식탁등 고를 때 제가 배운 것\n\n1. 높이가 생명 — 식탁 위 60~80cm까지 과감하게 내리세요. 머리에 닿을까 걱정되지만, 앉으면 눈높이 위라 안 걸려요.\n2. 전구색(따뜻한 노란빛)으로 — 흰 빛이면 카페가 아니라 급식실이 돼요.\n3. 설치가 겁나면 맡기세요 — 저는 비츠 딜리버리로 배달과 설치를 한 번에 해결했어요.\n\n식탁은 하루 중 가족이 가장 오래 마주 앉는 자리잖아요. 그 자리 위의 빛 하나가 저녁의 온도를 바꿔요. 진심이에요.\n\n## 자주 묻는 질문도 정리해봤어요\n\n**Q. 유리 펜던트, 깨질까 봐 걱정돼요.**\n저도 아이가 있어서 제일 먼저 걱정한 부분이에요. 식탁 위는 사람이 지나다니는 동선이 아니라서 부딪힐 일이 거의 없더라고요. 2년째 쓰는 지금까지 이가 나간 적도 없어요.\n\n**Q. 전구는 아무거나 끼우면 되나요?**\n따뜻한 전구색(3000K 정도)을 추천해요. 저는 처음에 집에 있던 하얀 주광색 전구를 끼웠다가 바로 바꿨어요. 같은 등인데 빛 색 하나로 급식실과 카페를 오가더라고요.\n\n**Q. 식탁 위에 등이 하나면 어둡지 않나요?**\n밥 먹고 책 읽는 데는 충분해요. 다만 식탁에서 공부나 바느질처럼 정밀한 일을 오래 한다면, 그때만 거실등을 함께 켜면 돼요. 평소엔 펜던트 하나가 만드는 아늑함이 훨씬 커요.\n\n**Q. 원형 식탁인데 어울릴까요?**\n원형 식탁엔 등 하나를 정중앙에 다는 게 제일 예뻐요. 저희는 4인 사각 식탁이라 중앙에 하나 달았는데, 6인 이상 긴 식탁이면 두 개를 나란히 다는 것도 좋대요.\n\n## 등 하나로 시작하는 우리 집 카페\n\n돌아보면 저는 인테리어를 크게 바꾼 게 아니었어요. 가구도 그대로, 벽지도 그대로였죠. 바뀐 건 식탁 위 빛의 높이와 색, 딱 두 가지였어요. 그런데 가족이 식탁에 머무는 시간은 두 배가 됐어요. 오늘 저녁, 식탁 위를 한번 올려다보세요. 그 자리가 우리 집에서 가장 아까운 자리일지도 몰라요.\n\n덧붙이면, 계절마다 전구 하나로 분위기를 갈아입힐 수도 있어요. 여름엔 살짝 밝은 전구로 청량하게, 겨울엔 더 노란 전구로 포근하게. 등은 그대로 두고 전구만 바꾸는 건데, 커튼 바꾸는 것보다 쉽고 효과는 더 커요.\n\n![](products/vittz/seraphim.jpg)\n\n---\n**이 글에서 소개한 제품**\n- 세라핌 1등 인테리어 식탁등 → https://vittz.co.kr/shop/shopdetail.html?branduid=1100003357\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-nb-bang","topic":"아이방 방등","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"VITTZ 조명 가이드","headline":"아이 *방등* 바꾸고 달라진 숙제 시간","sub":"핵심 키워드: LED방등 (월간 6,030회)","dayLabel":"네이버 블로그","cardImage":"blog/w2-nb-bang/cover.png","captionNote":"핵심 키워드 LED방등 6,030 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2120자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 아이 방 방등 바꾸고 알았어요, 숙제 시간이 짧아진 이유\n\n결론부터요. 아이가 \"눈 아파\"라며 30분 만에 책상을 떠나던 게, 방등 하나 바꾸고 나서 눈에 띄게 줄었어요. 방등은 그냥 밝으면 되는 줄 알았는데, 아니었더라고요. 오늘은 아이 방 등을 고르며 배운 걸 처음 겪는 분들 눈높이로 정리해 드릴게요.\n\n![](blog/w2-nb-bang/scene-1.jpg)\n\n## 아이가 자꾸 눈을 비비던 이유\n\n작년 겨울, 초등 2학년 딸아이가 숙제하다 자꾸 눈을 비볐어요. 시력 걱정에 안과부터 갔는데, 의사 선생님이 뜻밖의 질문을 하셨어요. \"방 조명이 오래됐나요?\"\n\n집에 와서 방등을 올려다보니, 이사 올 때부터 있던 정체 모를 등이었어요. 그리고 처음 알았어요. 오래된 등은 우리 눈에 안 보이는 속도로 깜빡인다는 걸요(이걸 플리커라고 부르더라고요). 형광등 아래에서 오래 있으면 머리가 지끈했던 기억, 다들 있으시죠? 그 원리예요. 눈은 그 깜빡임을 쫓아가느라 계속 일을 하는 거래요.\n\n![](blog/w2-nb-bang/fig-1.png)\n\n## 방등을 고르며 배운 세 가지\n\n**첫째, 플리커프리.** 깜빡임을 걸러준 빛이에요. 아이 방이라면 저는 이게 밝기보다 먼저라고 생각해요.\n\n**둘째, 색온도 변환.** 낮 숙제 시간엔 하얀빛(집중 모드), 잠들기 전엔 노란빛(포근 모드)으로 리모컨 하나로 바뀌어요. 하나의 등이 공부방과 침실을 오가는 셈이죠.\n\n**셋째, 정품 LED 모듈.** 등의 심장이에요. 심장이 튼튼해야 몇 년이 지나도 밝기가 덜 떨어져요. 저는 삼성 정품 모듈을 쓴 비츠 델룬 방등 60W로 바꿨어요. 가격도 부담스럽지 않았고요.\n\n## 바꾸고 한 달, 달라진 것들\n\n숙제 시간에 눈 비비는 횟수가 줄었어요. 그리고 재미있는 변화가 하나 더 있는데, 잠들기 전 노란빛으로 바꿔주면 아이가 \"취침등 켜졌다\"며 스스로 이불로 들어가요. 빛이 생활 리듬의 스위치가 된 거예요.\n\n사진도 달라졌어요. 아이 방에서 찍는 사진마다 누렇게 나와서 고민이었는데, 지금은 낮처럼 깨끗하게 나와요.\n\n## 자주 묻는 질문\n\n**Q. 방등은 몇 와트가 적당해요?**\n일반 침실·아이 방은 50~60W면 충분해요. 거실등(120~180W)과 헷갈리지 마세요. 방이 너무 밝으면 오히려 잠들기 어려워요.\n\n**Q. 교체가 어렵지 않나요?**\n기존 방등 자리에 그대로 다는 거라 큰 공사는 아니에요. 다만 천장 작업이 겁나면 저처럼 배달+설치를 한 번에 해주는 비츠 딜리버리를 쓰세요. 20분이면 끝나요.\n\n**Q. 아이가 무서워하는 어둠, 어떻게 해요?**\n색온도 변환 등의 노란빛을 '한 단계 어둡게' 켜두는 걸로 해결했어요. 따로 수면등을 사기 전에 방등의 조광 기능부터 확인해 보세요.\n\n## 마무리하며\n\n아이 방 인테리어를 고민할 때 우리는 책상, 침대, 벽지 순서로 생각하잖아요. 그런데 아이가 하루 중 가장 오래 마주 보는 건 사실 천장의 빛이에요. 등 하나 바꾸는 일, 생각보다 큰 선물이 될 수 있어요.\n\n## 방등과 함께 챙기면 좋은 것\n\n방등을 바꾸면서 저는 책상 스탠드도 점검했어요. 방 전체는 방등이, 책 위는 스탠드가 나눠 맡는 구조가 눈에 제일 편하대요. 방등만 쨍하게 밝히고 스탠드 없이 공부하면, 책에 내 그림자가 지거든요. 방등은 은은하게 + 스탠드는 또렷하게, 이 조합을 기억해 두세요.\n\n그리고 등을 바꾸는 김에 방 안 빛의 색을 통일해 주면 좋아요. 방등은 하얀빛인데 스탠드는 노란빛이면, 눈이 두 가지 빛 사이를 오가며 피로해져요. 낮 공부 시간엔 둘 다 하얀 계열로, 저녁엔 둘 다 노란 계열로 맞춰주는 게 포인트예요.\n\n## 한 달 뒤, 남편이 한 말\n\n\"어, 애 방이 제일 좋아 보이네?\" — 등 하나 바꿨을 뿐인데요. 아이 방 인테리어에서 조명은 가장 저렴한데 가장 티가 많이 나는 항목이었어요. 다음 목표는 저희 안방이에요.\n\n책상 위치도 함께 봐주면 금상첨화예요. 방등 바로 아래보다 창가 쪽, 빛이 왼손 방향에서 들어오는 자리(오른손잡이 기준)가 그림자가 덜 져요. 등을 바꾸는 날, 책상 방향도 한 번만 점검해 보세요.\n\n![](products/vittz/bang60.jpg)\n\n---\n**이 글에서 소개한 제품**\n- LED 델룬 방등 60W → https://vittz.co.kr/shop/shopdetail.html?branduid=1100006929\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-nb-layering","topic":"무드 조명 레이어링","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-13T09:00:00.000Z","kicker":"VITTZ 조명 가이드","headline":"*무드등*보다 먼저, 빛의 3의 법칙","sub":"핵심 키워드: 무드등 (월간 21,240회)","dayLabel":"네이버 블로그","cardImage":"blog/w2-nb-layering/cover.png","captionNote":"핵심 키워드 무드등 21,240 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2155자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 무드등 어디에 둘까 고민된다면, 저는 '3의 법칙'부터 알려드려요\n\n결론부터 말씀드리면, 분위기 좋은 집은 무드등을 '더 사는' 게 아니라 빛을 세 자리에 '나눠 두는' 집이었어요. 저희 집 거실은 등 하나를 더 산 게 아니라 빛의 자리를 바꾸고 나서 완전히 달라졌거든요. 무드등을 알아보다가 여기까지 오신 분들께, 제가 돌고 돌아 배운 순서를 알려드릴게요.\n\n![](blog/w2-nb-layering/scene-1.jpg)\n\n## 무드등을 샀는데 왜 분위기가 안 살까\n\n고백하자면 저는 무드등만 세 개를 샀던 사람이에요. 귀여운 달 모양, 버섯 모양… 그런데 켜보면 예쁜 건 등이지 방이 아니더라고요. 어느 날 카페에서 깨달았어요. 카페엔 '무드등'이 없어요. 대신 빛이 세 종류가 있어요.\n\n- 천장에서 은은하게 전체를 밝히는 빛 (베이스)\n- 벽이나 그림을 비추는 빛 (포인트)\n- 테이블 위로 낮게 내려온 빛 (무드)\n\n우리 집 거실은 천장등 하나가 셋의 일을 혼자 하고 있었던 거예요. 그러니 무드등을 사다 놓아도, 대낮처럼 밝은 천장등 아래에선 존재감이 없었던 거고요.\n\n![](blog/w2-nb-layering/fig-1.png)\n\n## 저희 집에 적용한 순서\n\n1단계로 저녁 8시 이후엔 거실 천장등을 끄기로 했어요. 대신 식탁 위 세라핌 유리 펜던트를 켜요. 유리 결을 타고 퍼지는 노란빛이 테이블 주변을 카페 테이블처럼 만들어줘요.\n\n2단계로 벽엔 젤로비 레일 스팟을 달아 그림 한 점을 비췄어요. 벽에 빛이 흐르니 낮엔 밋밋했던 벽이 밤엔 갤러리가 돼요.\n\n3단계, 그제야 무드등이 살아났어요. 소파 옆 협탁에 둔 작은 무드등이 세 번째 빛으로 제 몫을 하더라고요. 주인공이 아니라 앙상블의 한 명이 되니까요.\n\n## 무드 조명 초보가 자주 묻는 것들\n\n**Q. 뭐부터 사야 해요?**\n새로 사기 전에 오늘 밤 천장등부터 꺼보세요. 그리고 집에 있는 스탠드나 펜던트 하나만 켜보는 거예요. 우리 집에 어떤 빛이 부족한지 그때 보여요.\n\n**Q. 빛 색은 통일해야 하나요?**\n저녁 조명은 전구색(따뜻한 노란빛)으로 통일하는 걸 추천해요. 노란빛과 흰빛이 섞이면 이도 저도 아닌 어정쩡한 공간이 되더라고요.\n\n**Q. 전기요금 걱정돼요.**\nLED 기준으로 펜던트+스팟+무드등을 저녁 내내 켜도 거실 천장등 하나보다 적게 먹는 조합이 충분히 가능해요. 오히려 큰 등을 끄는 시간이 늘어서 이득이었어요.\n\n## 오늘 밤 해볼 수 있는 것\n\n거창하게 시작할 필요 없어요. 오늘 밤 8시, 거실 천장등을 끄고 작은 등 하나만 켜보세요. 가족들 반응이 답을 알려줄 거예요. 저희 집은 그날 남편이 \"우리 집 되게 좋다\"라고 했어요. 5년 만에 처음요.\n\n## 평수별로 간단히 정리하면\n\n- **원룸·오피스텔**: 천장등 + 침대 옆 무드등, 딱 두 개면 돼요. 저녁엔 무드등만.\n- **20평대**: 거실 천장등 + 식탁 펜던트 + 무드등 하나. 저녁의 주인공은 펜던트예요.\n- **30평대 이상**: 여기에 벽 스팟(레일)을 더하면 완성. 손님 오는 날 진가가 나와요.\n\n한 번에 다 갖출 필요 없어요. 저도 1년에 걸쳐 하나씩 늘렸어요. 조명은 가구와 달리 하나 더할 때마다 집이 눈에 띄게 달라져서, 늘려가는 재미가 있는 품목이에요.\n\n## 흔한 실수 하나만 짚을게요\n\n무드 조명을 '어두운 조명'으로 오해하는 거예요. 무드는 어두운 게 아니라 필요한 곳만 밝은 상태예요. 테이블 위는 책을 읽을 만큼 밝고, 나머지가 은은한 것. 그래서 무드를 만들고도 생활이 전혀 불편하지 않아요. 오히려 눈은 더 편해지고요.\n\n참, 콘센트 자리도 미리 봐두세요. 무드등과 스탠드는 결국 콘센트 근처에 살게 되거든요. 멀티탭이 보이면 무드가 깨지니까, 가구 뒤로 선을 숨길 수 있는 자리를 먼저 찾고 등을 두는 게 순서예요.\n\n빛이 세 자리로 나뉜 집은 사진도 잘 나와요. 손님들이 \"집이 왜 이렇게 아늑해요?\"라고 물으면, 이제 대답해 주세요. 등을 더 산 게 아니라 빛의 자리를 나눴을 뿐이라고요.\n\n![](products/vittz/seraphim-2.jpg)\n\n---\n**이 글에서 소개한 제품**\n- 세라핌 1등 인테리어 식탁등 → https://vittz.co.kr/shop/shopdetail.html?branduid=1100003357\n- COB 젤로비 레일조명 → https://vittz.co.kr/shop/shopdetail.html?branduid=2081318\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-nb-downlight","topic":"다운라이트","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-14T09:00:00.000Z","kicker":"VITTZ 조명 가이드","headline":"*다운라이트*, 이사 전에 알았으면 좋았을 것","sub":"핵심 키워드: 다운라이트 (월간 10,010회)","dayLabel":"네이버 블로그","cardImage":"blog/w2-nb-downlight/cover.png","captionNote":"핵심 키워드 다운라이트 10,010 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2043자(이미지 제외 본문). 레퍼런스 문법: 입문 가이드형+포트폴리오 사례형","captionBody":"# 다운라이트, 이사 전에 알았으면 좋았을 것들만 모았어요\n\n결론부터요. 천장이 낮아 보이는 집, 답답해 보이는 복도의 해답이 매입등(다운라이트)이었어요. 등이 천장 속으로 쏙 들어가니 천장이 손바닥 하나만큼 높아 보이더라고요. 인테리어 공사를 앞두고 다운라이트가 처음이신 분들께, 제가 미리 알았으면 좋았을 것들만 추려 드릴게요.\n\n## 다운라이트가 뭐예요?\n\n천장에 동그란 구멍을 내고 그 안에 심는 작은 등이에요. 등이 천장 밖으로 튀어나오지 않으니까, 천장 면이 매끈하게 정리돼요. 호텔 복도나 모델하우스 천장을 떠올리면 바로 그 등이에요.\n\n비유하자면, 일반 등이 천장에 붙인 '벽시계'라면 다운라이트는 벽 속에 넣은 '매립 선반'이에요. 존재감을 지우는 대신 공간을 넓어 보이게 하죠.\n\n![](blog/w2-nb-downlight/fig-1.png)\n\n## 어디에 쓰면 좋은가요\n\n**복도와 현관**이 첫 번째예요. 좁고 긴 공간에 큰 등을 달면 더 좁아 보이는데, 다운라이트를 일정한 간격으로 심으면 호텔 복도처럼 정돈돼요.\n\n**거실 보조등**으로도 좋아요. 거실등을 끄고 다운라이트 몇 개만 켜면, 손님 오기 전 카페 무드가 3초 만에 완성돼요.\n\n**주방 싱크대 위**도 명당이에요. 요리할 때 내 그림자가 도마를 가리는 문제, 싱크대 위 다운라이트가 해결해줘요.\n\n## 공사 전에 꼭 확인할 세 가지\n\n**첫째, 타공 크기.** 다운라이트는 3인치, 4인치, 6인치처럼 구멍 크기가 정해져 있어요. 기존 등을 교체한다면 지금 뚫린 구멍 크기부터 재세요. 구멍보다 작은 등을 사면 낭패예요.\n\n**둘째, 확산형인지.** 빛이 부드럽게 퍼지는 확산형이 집엔 편해요. 한 점을 쏘는 집중형은 그림 비출 때만 쓰고요.\n\n**셋째, 개수 계획.** 다운라이트는 하나하나는 약하고 여러 개가 모여 일해요. 도배·공사 때 한 번에 계획하는 게 나중에 천장을 또 뚫는 것보다 훨씬 깔끔해요.\n\n## 자주 묻는 질문\n\n**Q. 전구만 갈 수 있나요?**\n요즘 LED 다운라이트는 일체형이 많아요. 수명이 다하면 등 자체를 바꾸는 방식인데, 교체가 간단하고 가격도 부담 없는 편이에요.\n\n**Q. 몇 개나 달아야 해요?**\n복도는 1~1.5m 간격, 거실 보조용은 소파·테이블 위주로 4~6개가 일반적이에요. 공간 사진을 들고 상담받으면 개수를 잡아줘요.\n\n**Q. 셀프 시공 가능한가요?**\n천장 배선을 만지는 일이라 전기 작업이 익숙하지 않다면 시공을 맡기시길 권해요. 비츠는 무료 출장 컨설팅과 설치 서비스가 있어서, 저는 개수 계획부터 상담으로 잡았어요.\n\n## 마무리\n\n다운라이트는 화려한 주인공이 아니에요. 하지만 잘 심어둔 다운라이트는 집을 조용히 넓혀줘요. 이사나 리모델링을 앞두고 계시다면, 벽지 고르기 전에 천장 계획부터 세워보세요. 순서만 바꿔도 결과가 달라져요.\n\n## 저희 집 적용기 — 복도 4개, 거실 6개\n\n저희 집은 리모델링 때 복도에 4개, 거실 소파 라인에 6개를 심었어요. 복도는 1.2m 간격으로 일렬, 거실은 소파와 테이블 위주로 두 줄. 공사 전엔 '너무 많나?' 싶었는데, 살아보니 이 개수가 딱이에요. 전부 켜는 날은 거의 없고, 그날 기분 따라 절반만 켜거든요. 다운라이트는 여러 개를 심되 나눠 켜는 게 운영의 묘예요.\n\n스위치를 두 개 회로로 나눈 것도 잘한 선택이었어요. 복도 스위치 하나, 거실 스위치 하나. 이걸 한 회로로 묶으면 전부 켜거나 전부 꺼야 해서 무드 조절이 안 돼요. 공사 전에 꼭 회로 분리를 요청하세요.\n\n## 마지막 당부\n\n다운라이트는 '심는 등'이라 되돌리기가 번거로워요. 그래서 더더욱 계획이 절반이에요. 사진 몇 장 들고 무료 출장 컨설팅부터 받아보시길 — 저는 그 상담 30분이 공사비 몇십만 원을 아껴줬다고 생각해요.\n\n참고로 다운라이트 빛 색도 공간 따라 나누면 좋아요. 복도·현관은 손님맞이 느낌의 전구색, 주방 작업 구간은 또렷한 주백색. 같은 다운라이트라도 색만 나누면 공간의 역할이 분명해져요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 매입/다운라이트 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=006\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"}],"stats":{"publishedCount":0,"pendingCount":5,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"blogger","label":"구글 블로그","icon":"🅱️","active":true,"published":[],"pending":[{"id":"w2-gb-living","topic":"거실등 교체","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-10T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"거실이 어두워 보이는 *진짜 이유*","sub":"핵심 키워드: 거실LED등 (월간 14,510회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-living/cover.png","captionNote":"핵심 키워드 거실LED등 14,510 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2125자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 거실이 어두워 보이는 진짜 이유, 등 탓이 맞았어요\n\n결론부터요. 저희 집 거실이 칙칙해 보였던 범인은 소파도 벽지도 아니고 5년 넘은 거실등이었어요. LED 거실등으로 바꾸고 나서 \"집 넓어졌어?\"라는 말을 들었거든요. 가볍게, 딱 필요한 것만 정리해 드릴게요.\n\n![](blog/w2-gb-living/scene-1.jpg)\n\n## 거실등도 늙는다는 사실, 아셨어요?\n\nLED는 반영구인 줄 알았는데 아니더라고요. 형광등처럼 팍 나가는 게 아니라, 몇 년에 걸쳐 조금씩 어두워져요. 매일 보는 우리 눈은 그 변화를 눈치채지 못하고요. 휴대폰 배터리가 서서히 닳는 것처럼, 빛도 서서히 닳아요.\n\n우리 집 등이 늙었는지 확인하는 법은 간단해요. 밤에 거실 사진을 한 장 찍어보세요. 사진이 눈으로 보는 것보다 누렇고 어둡게 나오면, 등이 보내는 신호예요.\n\n![](blog/w2-gb-living/fig-1.png)\n\n## 바꿀 때 딱 두 가지만 보세요\n\n**첫째, 와트(W)는 평수 따라.** 20평대는 120~150W, 30평대는 150~180W가 기준이에요. 지금 어둡게 느껴진다면 한 단계 위로 가세요. 후회 없어요.\n\n**둘째, 플리커프리인지.** 빛이 미세하게 깜빡이는 걸 걸러주는 기능인데, 눈 피로가 달라져요. 저는 델룬 LED 거실등 180W로 바꿨는데, 삼성 정품 LED 모듈에 플리커프리라 저녁에 TV 볼 때 눈이 한결 편해졌어요.\n\n## 교체, 생각보다 일이 아니에요\n\n저는 전기 기사님을 따로 부를 줄 알았는데, 비츠 딜리버리로 배달과 설치를 한 번에 예약했어요. 기사님이 오셔서 20분 만에 끝났고, 저는 커피만 내렸어요.\n\n등을 바꾼 날 저녁, 거실이 한 뼘 넓어 보였어요. 벽지 색이 원래 이랬구나 싶었고요. 이사 없이 집 분위기를 바꾸는 방법 중 이만한 가성비가 없어요.\n\n## 이왕 바꾸는 김에 알아두면 좋은 것들\n\n**색온도 변환 기능**은 있으면 확실히 써요. 낮엔 하얀빛으로 또렷하게, 저녁엔 노란빛으로 아늑하게, 리모컨으로 바꾸는 기능이에요. 저는 주말 아침 청소할 때는 주광색, 저녁 영화 볼 때는 전구색으로 바꿔 쓰는데, 거실이 두 얼굴이 됐어요.\n\n**KC 인증**도 확인하세요. 천장에서 매일 몇 시간씩 켜두는 물건이라, 안전 인증은 기본이에요. 정품 LED 모듈을 쓰는지도요. 모듈이 부실하면 몇 년 못 가 또 어두워지거든요.\n\n## 자주 묻는 질문 하나만\n\n**Q. 등 교체 시기를 숫자로 알 수 있나요?**\nLED 거실등의 밝기 수명은 보통 5~7년이라고 해요. 이사 올 때부터 있던 등이거나, 언제 달았는지 기억이 안 난다면 그게 신호예요. 저희 집 등도 '전 주인 때부터 있던 등'이었어요.\n\n## 바꾸고 나서 한 달, 솔직 후기\n\n가장 좋은 건 사진이에요. 거실에서 아이 사진을 찍으면 예전엔 다 누렇게 나와서 보정을 했는데, 지금은 찍은 그대로 써요. 그리고 이상하게 저녁에 거실에 모이는 시간이 늘었어요. 밝고 쾌적한 곳으로 사람이 모이는 건 본능인가 봐요. 도배나 이사를 고민 중이셨다면, 그 전에 등부터 바꿔보세요. 비용은 10분의 1인데 체감은 절반쯤 따라와요.\n\n## 셀프 교체를 생각 중이라면 딱 한 가지만\n\n유튜브 보면 셀프 교체가 쉬워 보이는데, 딱 하나만 꼭 지켜주세요. 차단기를 내리고 작업하기. 천장 조명 작업은 감전과 낙상 사고가 가장 많은 집안일이에요. 사다리 위에서 두 손을 다 쓰는 작업이라, 자신 없으면 설치 서비스를 쓰는 게 몸에도 마음에도 이득이에요. 저처럼 커피 내리면서 기다리는 쪽을 추천할게요.\n\n## 오늘의 요약\n\n- 거실이 칙칙하면 벽지보다 등부터 의심하기 (LED도 5~7년이면 어두워져요)\n- 와트는 평수 기준 한 단계 여유 있게, 플리커프리는 필수\n- 색온도 변환이 있으면 거실이 두 얼굴이 됨\n- 설치는 배달+설치 한 번에, 무리한 셀프 작업은 금물\n\n마지막으로 하나 더. 등을 바꾸는 김에 리모컨 수신 기능이 있는 제품을 고르면, 침대나 소파에서 끄고 켤 수 있어요. 사소해 보이는데, 겨울밤 이불 밖으로 나가서 스위치 끄러 가는 일이 사라지는 건 생각보다 큰 행복이에요.\n\n![](products/vittz/delun180.jpg)\n\n---\n**이 글에서 소개한 제품**\n- LED 델룬 거실등 180W → https://vittz.co.kr/shop/shopdetail.html?branduid=1100006932\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-rail","topic":"레일조명","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-11T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"카페 벽 조명, *레일 하나*면 됩니다","sub":"핵심 키워드: 레일조명 (월간 11,700회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-rail/cover.png","captionNote":"핵심 키워드 레일조명 11,700 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2142자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 카페 벽 조명, 알고 보니 레일 하나면 따라 할 수 있어요\n\n결론 먼저요. 분위기 좋은 카페 벽의 그 빛, 레일조명 하나로 우리 집에서 재현됩니다. 저는 다이닝 벽에 레일 하나 달고 스팟 세 개 끼웠는데, 친구가 오더니 \"여기 카페야?\"라고 했어요. 방법만 가볍게 정리할게요.\n\n![](blog/w2-gb-rail/scene-1.jpg)\n\n## 카페 벽이 예뻐 보이는 비밀\n\n카페에 가면 벽에 빛이 부챗살처럼 흘러내리죠. 저건 벽을 향해 스팟 조명을 쏘는 '월 워싱'이라는 기법이에요. 빛이 벽의 질감을 타고 흐르면서 밋밋한 벽이 갑자기 입체적으로 보여요. 낮과 밤의 얼굴이 달라지는 거죠.\n\n집에서 이걸 하려면 조명을 여러 개 달아야 할 것 같지만, 레일조명은 반대예요. 천장에 레일 한 줄을 달고, 그 위에 스팟을 원하는 개수만큼 끼우는 방식이거든요. 콘센트 멀티탭처럼, 자리만 만들어두면 조명을 더하고 빼고 옮기는 게 자유로워요.\n\n![](blog/w2-gb-rail/fig-1.png)\n\n## 제가 단 방법 (아주 간단해요)\n\n저는 비츠의 COB 젤로비 레일조명을 골랐어요. 스팟 하나가 만원대라 부담이 없었고, 나중에 하나씩 추가할 수 있다는 게 결정적이었어요.\n\n배치는 이렇게 했어요.\n1. 스팟 하나는 벽의 그림을 향해\n2. 하나는 선반 소품을 향해\n3. 하나는 식탁 모서리를 살짝 스치게\n\n포인트는 정면이 아니라 비스듬히 쏘는 거예요. 빛이 스치듯 지나가야 그림자가 생기면서 카페 느낌이 나요. 손전등을 벽에 바짝 대고 비스듬히 비춰보면 어떤 느낌인지 바로 아실 거예요.\n\n## 한 달 써보니\n\n저녁에 거실 큰 등을 끄고 레일 스팟만 켜는 날이 많아졌어요. 같은 집인데 빛의 방향만 바뀌었을 뿐인데도, 하루의 끝이 좀 근사해졌달까요. 인테리어 소품 열 개보다 스팟 세 개가 나았어요.\n\n## 이런 분들께 특히 추천해요\n\n- 전셋집이라 못질·타공이 부담스러운 분 — 레일은 기존 등 자리 배선을 활용하는 시공이 가능해서 부담이 적어요.\n- 그림·포스터를 걸어둔 분 — 스팟 하나가 그림을 갤러리 작품으로 만들어요.\n- 조명 초보인 분 — 스팟 하나부터 시작해서 취향 따라 늘리면 돼요. 실패 비용이 만원대예요.\n\n## 자주 묻는 질문\n\n**Q. 전기요금 많이 나오지 않나요?**\nCOB LED 스팟은 하나에 10~30W 수준이에요. 스팟 세 개를 저녁 내내 켜도 형광등 하나보다 가벼워요.\n\n**Q. 빛이 눈부시지 않나요?**\n스팟을 사람 쪽이 아니라 벽·소품 쪽으로 돌리는 게 규칙이에요. 우리는 빛을 직접 보는 게 아니라, 벽에 반사된 부드러운 빛을 즐기는 거니까요.\n\n**Q. 레일 색은 뭐가 좋아요?**\n천장이 흰색이면 흰 레일이 감쪽같고, 카페처럼 힘을 주고 싶으면 검정 레일이 예뻐요. 저는 검정을 골랐는데 낮에는 그 자체로 인테리어 라인이 돼요.\n\n## 마지막 팁 하나\n\n레일조명의 진짜 매력은 '바꿀 수 있다'는 거예요. 계절 따라 그림을 바꾸듯 스팟 방향만 틀어도 집 분위기가 갈아입어져요. 오늘은 벽으로, 크리스마스엔 트리로. 조명이 소모품이 아니라 취미가 되는 경험, 레일에서 시작해보세요.\n\n## 오늘의 요약\n\n- 카페 벽의 비밀은 '월 워싱' — 벽에 비스듬히 빛을 흘리는 것\n- 레일 한 줄 + 스팟 세 개면 시작 충분, 스팟은 만원대부터\n- 스팟은 사람이 아니라 벽·그림·소품을 향하게\n- 나중에 취향 따라 추가·이동 가능한 게 레일의 진짜 매력\n\n## 하나 더 — 계절마다 스팟 방향 바꾸기\n\n저는 계절이 바뀔 때 스팟 방향을 조금씩 틀어요. 여름엔 시원한 그림 쪽으로, 연말엔 트리 쪽으로. 조명이 바뀌면 같은 집이 새 집처럼 보여요. 가구 재배치보다 힘이 10분의 1인데 효과는 비슷해요. 레일조명은 사놓고 끝나는 게 아니라 계속 갖고 노는 조명이라는 것, 이게 제가 레일을 추천하는 진짜 이유예요.\n\n그리고 처음 다는 분들이 자주 묻는 것 하나 — \"레일 길이는 얼마가 좋아요?\" 1m면 스팟 2~3개, 1.5m면 3~4개가 여유롭게 들어가요. 벽 폭의 3분의 2 정도 길이로 고르면 비율이 안정적이에요. 스팟 간격은 40~50cm가 무난하고, 너무 촘촘하면 빛이 겹쳐서 오히려 입체감이 죽어요.\n\n![](products/vittz/jelrobi.jpg)\n\n---\n**이 글에서 소개한 제품**\n- COB 젤로비 레일조명 → https://vittz.co.kr/shop/shopdetail.html?branduid=2081318\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-sensor","topic":"현관 센서등","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"현관 *센서등* 5분 해결법","sub":"핵심 키워드: 센서등 (월간 15,360회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-sensor/cover.png","captionNote":"핵심 키워드 센서등 15,360 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2067자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 현관 센서등이 나갔을 때, 5분 만에 끝내는 법\n\n결론부터요. 현관 센서등 교체는 겁먹을 일이 아니었어요. 포인트만 알면 제품 고르기 5분, 설치는 기사님 오시면 10분이에요. 어두운 현관에서 신발 찾다 현타 온 분들을 위해 가볍게 정리했어요.\n\n![](blog/w2-gb-sensor/scene-1.jpg)\n\n## 센서등이 하는 일, 생각보다 커요\n\n현관 센서등은 집의 첫인사예요. 문 열고 들어왔을 때 자동으로 켜지는 그 2초가, 집이 나를 반겨주는 느낌을 만들거든요. 반대로 센서등이 나가면? 캄캄한 현관에서 벽을 더듬는 순간, 하루의 피로가 두 배가 돼요.\n\n손님이 왔을 때 첫인상도 현관 빛이 만들어요. 밝고 따뜻한 현관은 그 집 전체를 정돈돼 보이게 해요.\n\n![](blog/w2-gb-sensor/fig-1.png)\n\n## 고를 때 딱 세 가지만 보세요\n\n**첫째, 센서 방식.** 요즘은 대부분 움직임을 감지하는 방식이에요. 감지 범위가 넓을수록 문을 열자마자 켜져요.\n\n**둘째, 밝기와 빛 색.** 현관은 8~15W면 충분해요. 빛 색은 집 분위기 따라 — 아늑한 게 좋으면 전구색, 깔끔한 게 좋으면 주백색이요.\n\n**셋째, 디자인.** 현관 천장은 좁아서 등이 곧 인테리어예요. 얇고 심플한 원형이 어떤 집이든 무난하게 어울려요.\n\n## 이런 신호면 교체 타이밍이에요\n\n- 들어와서 두세 걸음 걸어야 켜진다 (센서 노화)\n- 켜지는 데 1초 이상 걸린다\n- 벌레 그림자가 비친다 (커버 틈새 벌어짐)\n\n저희 집은 세 번째였어요. 여름마다 등 안에 작은 벌레가... 더 말하지 않을게요. 얇은 일체형으로 바꾸고 해결됐어요.\n\n## 셀프로 갈까, 맡길까\n\n센서등은 천장 등 중에 가장 작고 가벼워서 셀프 난도가 낮은 편이에요. 다만 차단기 내리는 것만은 꼭 지켜주세요. 사다리 작업이 부담이면 설치 서비스로 — 비츠는 배달과 설치를 한 번에 해결해주는 딜리버리가 있어요.\n\n## 오늘의 요약\n\n- 센서등은 집의 첫인사, 나가면 삶의 질이 확 떨어짐\n- 고르기: 감지 잘 되는지 · 8~15W · 얇고 심플한 디자인\n- 늦게 켜지고 벌레 그림자 보이면 교체 신호\n- 셀프든 설치든, 차단기부터 내리기\n\n## 센서등을 200% 쓰는 작은 팁\n\n**신발장 안에도 하나.** 요즘은 배터리식 무선 센서등도 있어서, 신발장 문을 열면 켜지게 붙여두면 아침에 신발 찾기가 편해져요.\n\n**복도 중간에도 유용해요.** 밤에 아이 방과 화장실을 오가는 동선에 센서등이 있으면, 스위치를 더듬지 않아도 돼요. 특히 부모님 댁에 선물로 좋아요 — 야간 낙상 예방에 이만한 게 없거든요.\n\n**감지 시간도 확인하세요.** 켜져 있는 시간이 너무 짧으면 신발 신다가 꺼져요. 30초~1분 정도 유지되는 제품이 현관용으로 넉넉해요.\n\n## 저희 집 교체 후기 한 줄\n\n바꾸고 나서 제일 좋았던 순간은, 두 손 가득 장 봐온 날이었어요. 팔꿈치로 문 열고 들어서자마자 환하게 켜지는 현관. 별거 아닌데, 집이 \"고생했어\" 하고 맞아주는 기분이더라고요. 조명은 결국 그런 거 같아요. 기능은 기본이고, 기분을 만드는 것.\n\n## 같이 보면 좋은 조합\n\n현관 센서등을 바꾸는 김에 저는 복도 등까지 색을 맞췄어요. 현관은 전구색, 복도는 하얀빛이면 문 하나 사이로 빛이 뚝 끊겨 보이거든요. 현관→복도→거실로 이어지는 빛 색이 자연스럽게 연결되면, 집에 들어오는 동선 전체가 하나의 장면처럼 느껴져요. 등 하나가 아니라 '들어오는 길'을 디자인한다고 생각하면 골라야 할 답이 쉽게 보여요.\n\n마지막으로 비용 얘기를 솔직하게 하면, 센서등은 조명 중에 가장 부담 없는 축이에요. 제품은 1~3만 원대가 중심이고, 교체도 금방이라 '집에서 가장 가성비 좋은 업그레이드'로 꼽고 싶어요. 매일 최소 두 번(나갈 때, 들어올 때)은 만나는 빛이니까, 하루로 나누면 커피 한 잔 값도 안 되는 투자예요.\n\n그리고 이사·입주 청소 시즌이라면 센서등부터 갈아두세요. 짐 나르는 날 현관을 가장 많이 드나들게 되는데, 그때 새 센서등의 진가를 바로 느끼게 되실 거예요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 현관/센서등 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=010\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-mood","topic":"무드등 수면 루틴","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-13T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"잠드는 스위치, *무드등* 루틴","sub":"핵심 키워드: 무드등 (월간 21,240회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-mood/cover.png","captionNote":"핵심 키워드 무드등 21,240 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2079자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# 잠들기 전 30분, 무드등 하나로 수면 루틴 만든 후기\n\n결론부터요. 밤마다 침대에서 휴대폰을 놓지 못하던 제가, 무드등 하나로 '잠드는 스위치'를 만들었어요. 방법은 딱 하나 — 잘 준비가 되면 방등을 끄고 무드등만 켜는 거예요. 가볍게 공유할게요.\n\n![](blog/w2-gb-mood/scene-1.jpg)\n\n## 우리 몸은 빛으로 시간을 읽어요\n\n밤에 천장의 하얀 불빛을 쬐면 몸은 아직 낮이라고 착각한대요. 그래서 밝은 방에서 눕자마자 잠들기가 어려운 거예요. 반대로 낮은 곳에서 퍼지는 따뜻한 노란빛은 몸에게 '이제 저녁이야'라고 알려주는 신호가 돼요. 캠프파이어 앞에서 나른해지는 그 느낌이요.\n\n무드등은 예쁜 소품이기 전에, 몸의 시계를 저녁으로 돌려주는 리모컨인 셈이에요.\n\n![](blog/w2-gb-mood/fig-1.png)\n\n## 제가 만든 30분 루틴\n\n1. 밤 10시 반, 방등을 끄고 침대 옆 무드등만 켜요.\n2. 폰은 무드등 옆에 엎어둬요. (빛이 약하면 신기하게 폰 생각도 줄어요)\n3. 책 몇 장 읽다가 스르르.\n\n처음 3일은 어색했는데, 일주일 지나니 무드등을 켜는 순간 하품이 나오기 시작했어요. 몸이 빛을 기억하더라고요.\n\n## 무드등 고를 때 팁 세 가지\n\n- **빛 색은 무조건 전구색(노란빛)** — 하얀빛 무드등은 반쪽짜리예요.\n- **밝기 조절 되는 걸로** — 책 읽을 땐 2단, 잠들기 직전엔 1단.\n- **손 닿는 곳에** — 침대에서 팔 뻗어 끌 수 있어야 루틴이 완성돼요.\n\n## 아이 방에도 통해요\n\n아이들은 어둠을 무서워하지만, 사실 무서운 건 '갑자기 캄캄해지는 것'이에요. 방등에서 무드등으로, 빛을 한 단계씩 줄여주면 아이도 자연스럽게 잘 준비를 해요. 저희 집은 \"무드등 켜자\"가 \"이제 자자\"의 다정한 버전이 됐어요.\n\n## 오늘의 요약\n\n- 밤의 하얀 천장빛은 몸을 낮으로 착각하게 함\n- 잘 준비 = 방등 끄고, 낮고 따뜻한 빛 하나만\n- 전구색 · 밝기 조절 · 손 닿는 위치, 세 가지만 기억\n- 일주일이면 몸이 빛을 기억해요\n\n## 무드등, 침실 밖에서도 일해요\n\n**거실 소파 옆**에 두면 TV 볼 때 눈이 편해요. 캄캄한 방에서 TV만 켜면 화면과 어둠의 대비가 커서 눈이 쉽게 피로해지거든요. 뒤쪽에 은은한 무드등 하나가 그 대비를 줄여줘요.\n\n**식탁 위 선반**에 두면 야식 무드가 완성돼요. 라면도 무드등 아래에선 근사한 야식이 됩니다.\n\n**현관 콘솔 위**도 좋아요. 밤늦게 귀가하는 가족을 위해 켜두는 작은 불 — 실용을 넘어 마음이 담기는 자리예요.\n\n## 이런 건 피하세요\n\n- 화면 바로 옆의 강한 무드등 — 반사돼서 오히려 방해돼요.\n- 침대 머리맡의 '올려다보는' 위치 — 누웠을 때 광원이 직접 보이면 눈부셔요. 눈높이 아래, 빛이 벽이나 협탁을 향하게 두세요.\n- 충전 알림등이 깜빡이는 제품 — 애써 만든 어둠을 그 작은 LED가 다 망쳐요.\n\n결국 무드등의 핵심은 '빛을 직접 보지 않고, 빛이 닿은 곳을 보는 것'이에요. 이 한 줄만 기억하시면 어디에 두든 실패하지 않아요.\n\n## 한 달 루틴 후기, 숫자로\n\n잠들기까지 걸리는 시간(폰 기준 마지막 사용~수면 시작)이 평균 40분대에서 20분대로 줄었어요. 새벽에 깨서 폰 보는 날도 줄었고요. 무드등 하나가 한 일 치고는 과분한 성적표죠. 수면 앱이나 영양제보다 먼저, 침실의 빛부터 바꿔보시라고 말씀드리고 싶어요. 시작 비용도 제일 저렴하니까요.\n\n참, 무드등 타이머 기능이 있는 제품이면 한 단계 더 편해져요. 30분 뒤 자동으로 꺼지게 해두면, 책 읽다 잠들어도 아침까지 켜져 있을 걱정이 없어요. 저는 타이머를 '독서 마감시간'으로도 써요. 불이 꺼지면 오늘은 여기까지, 하고 눈을 감는 거죠.\n\n오늘 밤, 방등 스위치 대신 무드등 스위치에 손이 가는 작은 변화부터 시작해 보세요. 루틴은 거창한 결심이 아니라 손이 기억하는 순서더라고요.\n\n그리고 이 루틴의 숨은 보너스 — 무드등 아래에서는 침실 사진이 참 예쁘게 나와요. 호텔 침실 느낌의 그 사진, 필터가 아니라 조명이 만드는 거였더라고요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 스탠드/무드등 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=011\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"},{"id":"w2-gb-bulb","topic":"LED 전구 고르기","format":"블로그","channels":["blogger"],"scheduledFor":"2026-08-14T09:00:00.000Z","kicker":"VITTZ 라이트 노트","headline":"*LED 전구*, 숫자 두 개면 끝","sub":"핵심 키워드: LED전구 (월간 10,860회)","dayLabel":"구글 블로그","cardImage":"blog/w2-gb-bulb/cover.png","captionNote":"핵심 키워드 LED전구 10,860 기준(전월비 축적 전 → 검색량·시즌 상승 대체 규칙). SEO/GEO: 두괄식 결론·질문형 소제목·리스트/요약·키워드 제목 전방배치. 톤: 30대 여성 경험담·비유·전문용어 배제. 분량 2035자(이미지 제외 본문). 레퍼런스 문법: 라이트 리스트형(구글은 가볍게)","captionBody":"# LED 전구 살 때 숫자 두 개만 보면 실패 없어요\n\n결론부터요. 전구 고를 때 볼 건 딱 두 숫자 — 소켓 규격(E26/E14)과 색온도(K)예요. 이 둘만 맞으면 나머지는 취향이에요. 마트 전구 코너에서 20분 서성이던 과거의 저에게 알려주고 싶은 내용, 가볍게 정리했어요.\n\n## 첫 번째 숫자: E26이냐 E14냐\n\n전구 돌려 끼우는 부분(소켓)의 지름이에요. E26은 어른 엄지손가락 굵기의 표준 소켓, E14는 새끼손가락 굵기의 가는 소켓이에요. 국내 조명 대부분은 E26이고, 유럽풍 샹들리에나 작은 스탠드가 E14인 경우가 많아요.\n\n헷갈리면 다 쓴 전구를 들고 가거나, 소켓 사진을 찍어 가세요. 이거 하나면 반품 왕복 택배비를 아껴요.\n\n![](blog/w2-gb-bulb/fig-1.png)\n\n## 두 번째 숫자: 색온도 K\n\n- **3000K 전구색** — 노랗고 따뜻한 빛. 침실, 식탁, 무드 조명용.\n- **4000K 주백색** — 아이보리빛. 어디에나 무난한 중간값.\n- **5700K 주광색** — 하얗고 쨍한 빛. 공부방, 드레스룸, 주방 작업등용.\n\n비유하자면 3000K는 카페, 4000K는 우리 집 낮, 5700K는 편의점이에요. 켜질 공간에서 뭘 하는지 떠올리면 답이 나와요.\n\n## 와트가 아니라 루멘을 보세요\n\n옛날 백열전구 시절엔 와트(W)가 밝기였는데, LED는 와트가 '전기 먹는 양'일 뿐이에요. 밝기는 루멘(lm)으로 봐요. 백열 60W를 쓰던 자리라면 LED는 800lm 정도(소비전력은 8~10W)면 같은 밝기예요. 전기는 6분의 1만 먹고요.\n\n## 에디슨 전구는 언제 쓰나요\n\n필라멘트가 보이는 그 감성 전구요. 빛이 세지 않아서 메인 조명으론 아쉽고, 노출형 펜던트나 벽등에 끼워 '보여주는 빛'으로 쓰는 게 정답이에요. 카페 창가의 그 분위기가 바로 에디슨 전구예요.\n\n## 오늘의 요약\n\n- 소켓(E26/E14)과 색온도(K), 두 숫자만 맞추면 실패 없음\n- 밝기는 와트 말고 루멘 — 백열 60W ≈ LED 800lm\n- 3000K는 카페, 4000K는 낮, 5700K는 편의점\n- 에디슨 전구는 노출형 조명에 '보여주는 빛'으로\n\n## 자주 하는 실수 두 가지\n\n**밝기가 아쉬워서 아무 전구나 더 센 걸 끼우는 것.** 등기구마다 정격 와트 상한이 있어요. 상한보다 센 전구를 끼우면 열이 쌓여서 등도 전구도 수명이 짧아져요. 등기구에 적힌 최대 와트를 꼭 확인하세요.\n\n**조광(밝기 조절) 스위치에 일반 전구를 끼우는 것.** 밝기 조절 기능이 있는 조명엔 '디머블(조광용)' 표시가 있는 전구를 써야 해요. 일반 전구를 끼우면 지지직거리거나 깜빡여요.\n\n## 전구 바꾸기 좋은 날\n\n전구는 몰아서 바꾸는 게 이득이에요. 하나 나갔을 때 같은 시기에 끼운 전구들도 수명이 비슷하게 남았을 확률이 높거든요. 저는 연말 대청소 날을 '전구 점검의 날'로 정해두고, 색온도도 그때 계절에 맞게 정리해요. 소켓 규격을 메모장에 적어두면(우리 집 식탁등 E26, 스탠드 E14…) 다음 구매가 30초로 끝나요.\n\n## 오늘 집에 가서 해볼 것\n\n집 안 전구 소켓들을 폰으로 한 바퀴 찍어두세요. 딱 5분이면 돼요. 그 사진첩이 앞으로 몇 년간 전구 코너에서 서성일 시간을 다 아껴줍니다. 그리고 다음에 전구가 나가면, 오늘 배운 두 숫자만 기억하세요. 소켓 규격과 색온도. 이 글이 그때 떠오른다면 성공이에요.\n\n하나 더, 전구 색이 섞여 보이는 집이라면 오늘이 정리할 기회예요. 거실 등은 노란데 스탠드는 하얗고, 주방은 푸르스름하고… 색온도가 뒤섞이면 집이 어수선해 보여요. 전구를 점검하는 날, 공간별로 색온도를 통일해 주세요. 돈 안 드는 인테리어 중 효과 1등이에요.\n\n전구는 작지만 집 안에서 가장 자주 갈게 되는 소모품이에요. 오늘 정리해 둔 두 숫자가 앞으로 몇 년을 편하게 해줄 거예요.\n\n참, 남은 전구는 상자에 '구매일과 색온도'를 적어 보관하세요. 다음 교체 때 그 메모 하나가 큰 도움이 돼요.\n\n---\n**이 글에서 소개한 제품**\n- 비츠 전구 전체 보기 → https://www.vittz.co.kr/shop/shopbrand.html?xcode=056&mcode=012\n- 비츠조명 홈페이지 → https://www.vittz.co.kr/","status":"planned"}],"stats":{"publishedCount":0,"pendingCount":5,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"youtube","label":"유튜브","icon":"▶️","active":true,"published":[],"pending":[{"id":"test-yt-reels-3lights","topic":"조명 레이어링 릴스(쇼츠 재사용)","format":"쇼츠","channels":["youtube"],"scheduledFor":"2026-08-06T09:00:00.000Z","kicker":"VITTZ 조명 레시피","headline":"퇴근 후, 거실이 *카페*가 되는 3가지 빛","sub":"릴스와 동일 영상 — 유튜브 쇼츠 발행용","dayLabel":"쇼츠","cardImage":"shorts/test-reels-3lights/cover.png","captionBody":"퇴근하고 돌아온 거실, 불 하나만 바꿔도 카페가 됩니다.\n\n빛은 세 겹이면 충분해요.\n① 베이스 — const REPO = DATA.repo;
let ci = 0, ch = 'all';
// ── 운영 기간 선택 (전역 상태) ──
let period = { key:'all', from:null, to:null };
function periodRange(){
  if(period.key==='all') return null;
  const now=new Date(); let from,to;
  if(period.key==='7d'){ to=now; from=new Date(now.getTime()-6*864e5); }
  else if(period.key==='14d'){ to=now; from=new Date(now.getTime()-13*864e5); }
  else if(period.key==='30d'){ to=now; from=new Date(now.getTime()-29*864e5); }
  else if(period.key==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); to=now; }
  else if(period.key==='prev'){ from=new Date(now.getFullYear(),now.getMonth()-1,1); to=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(period.key==='custom'){
    if(!period.from&&!period.to) return null;
    from=period.from?new Date(period.from):new Date(0);
    to=period.to?new Date(period.to):now;
  } else return null;
  const f=new Date(from); f.setHours(0,0,0,0);
  const t=new Date(to); t.setHours(23,59,59,999);
  return [f.getTime(), t.getTime()];
}
function inPeriod(s){ const r=periodRange(); if(!r) return true; if(!s) return false; const t=new Date(s).getTime(); return t>=r[0]&&t<=r[1]; }
function periodLabel(){
  const names={all:'전체 기간','7d':'최근 7일','14d':'최근 14일','30d':'최근 30일',month:'이번 달',prev:'지난 달',custom:'직접 선택'};
  const r=periodRange();
  const d=x=>new Date(x).toISOString().slice(0,10);
  return names[period.key]+(r?' ('+d(r[0])+' ~ '+d(r[1])+')':'');
}
function periodBar(){
  const b=(k,l)=>'<button class="pbtn'+(period.key===k?' on':'')+'" onclick="setPeriod(\''+k+'\')">'+l+'</button>';
  return '<div class="panel pbar"><span class="pbar-t">📆 운영 기간</span>'+
    b('all','전체')+b('7d','최근 7일')+b('14d','최근 14일')+b('30d','최근 30일')+b('month','이번 달')+b('prev','지난 달')+
    '<span class="pbar-c">직접 선택 <input type="date" id="pfrom" value="'+(period.from||'')+'" onchange="setCustom()"/> ~ <input type="date" id="pto" value="'+(period.to||'')+'" onchange="setCustom()"/></span>'+
    '<span class="muted" style="margin-left:auto">'+periodLabel()+'</span></div>';
}
function setPeriod(k){ period.key=k; renderView(); }
function setCustom(){
  period.key='custom';
  period.from=(document.getElementById('pfrom')||{}).value||null;
  period.to=(document.getElementById('pto')||{}).value||null;
  renderView();
}
// ── 수정요청 (깃허브 이슈 연동: [수정요청·채널키] 제목 규약) ──
let ISSUES=null; // null=로딩중, []=없음/실패
let REF_ISSUES=[]; // [레퍼런스·채널] 이슈에서 즉시 파싱한 링크 (커밋 전에도 대시보드에 바로 표시)
let G_ISSUES=[]; // 지침 이슈(브랜드노트·디자인피드백·가이드) — 지침 탭 실시간 '접수됨' 표시용
const REQ_RE=/^\[수정요청·([a-z-]+)\]\s*(.*)$/;
const REF_RE=/^\[레퍼런스·([a-z-]+)\]/;
const GUID_RE=/^\[(브랜드노트·(분석|방향성|감도)|디자인피드백|가이드·([a-z-]+))\]/;
// 아직 데이터에 반영 안 됐을 수 있는 지침 이슈: 열려 있거나, 이 대시보드 생성 이후 등록된 것
function guidPending(kind, id){
  return G_ISSUES.filter(g=>g.kind===kind&&(kind!=='brand'||g.field===id)&&(kind!=='guide'||g.chKey===id)&&
    (g.state!=='closed'||String(g.created_at||'')>String(DATA.generatedAt||'')));
}
function pendBox(list){
  return list.map(p=>'<div class="capbox" style="border:1px solid #f0d9a8;background:#fffaf0;margin-bottom:8px;border-radius:10px;padding:10px 12px">'+
    '<div class="muted" style="font-size:11.5px;margin-bottom:4px">🕓 '+(p.state==='closed'?'반영 완료 — 잠시 후 본문에 표시됩니다':'접수됨 — 시스템 반영 처리중')+' · <a href="'+esc(p.html_url)+'" target="_blank">이슈↗</a></div>'+
    '<div class="mcap" style="font-size:13px;white-space:pre-wrap">'+esc(p.body.slice(0,400))+(p.body.length>400?'…':'')+'</div></div>').join('');
}
function myIssue(x){ return !x.clientId||x.clientId===DATA.clients[ci].id; } // 업체 스코프 (없으면 전 업체)
function channelIssues(key){ return (ISSUES||[]).filter(x=>x.chKey===key&&myIssue(x)); }
// 발행 게이트 — 이 콘텐츠에 걸린 미처리(열림) 수정요청. 특정 id 지정 요청은 그 콘텐츠만,
// '채널 공통' 요청은 그 채널의 발행 전 콘텐츠 전체를 보류시킨다 (publish-plan --due와 동일 규칙).
function openHolds(it){
  return (ISSUES||[]).filter(x=>x.state!=='closed'&&myIssue(x)&&(x.planId?x.planId===it.id:(it.channels||[]).includes(x.chKey)));
}
function loadIssues(){
  fetch('https://api.github.com/repos/'+REPO+'/issues?state=all&per_page=100&sort=created&direction=desc')
    .then(r=>r.ok?r.json():[])
    .then(arr=>{
      const list=(Array.isArray(arr)?arr:[]).filter(x=>!x.pull_request);
      ISSUES=list.map(x=>{
        const m=REQ_RE.exec(x.title||''); if(!m) return null;
        // 본문 '대상 콘텐츠: … (id: xxx)' → 특정 콘텐츠 수정요청. id 없으면 채널 공통.
        // '업체: xxx' → 여러 업체가 한 저장소를 쓸 때의 업체 스코프 (없으면 전 업체 적용 — 과거 이슈 호환)
        const idm=/\(id:\s*([\w.-]+)\)/.exec(String(x.body||''));
        const cm=/업체:\s*([\w-]+)/.exec(String(x.body||''));
        return { chKey:m[1], planId:idm?idm[1]:null, clientId:cm?cm[1]:null, titleClean:m[2]||x.title, state:x.state, html_url:x.html_url, created_at:x.created_at, closed_at:x.closed_at };
      }).filter(Boolean);
      // 레퍼런스 이슈 본문에서 링크를 즉시 수집 — 시스템 반영(커밋·배포) 전에도 '접수됨'으로 표시
      REF_ISSUES=[];
      for(const x of list){
        const m=REF_RE.exec(x.title||''); if(!m) continue;
        for(const line of String(x.body||'').split('\n')){
          const t=line.replace(/^[-*·•\s]+/,'').trim();
          const um=t.match(/^(https?:\/\/\S+)\s*(?:[—–-]\s*)?(.*)$/);
          if(um) REF_ISSUES.push({channel:m[1], url:um[1], note:(um[2]||'').trim(), issueUrl:x.html_url, at:x.created_at});
        }
      }
      // 지침 이슈(브랜드노트·디자인피드백·가이드)도 즉시 수집 — 지침 탭에 실시간 표시
      G_ISSUES=[];
      for(const x of list){
        const g=GUID_RE.exec(x.title||''); if(!g) continue;
        G_ISSUES.push({kind:g[1].indexOf('브랜드노트')===0?'brand':(g[1]==='디자인피드백'?'design':'guide'),
          field:g[2]||null, chKey:g[3]||null, body:String(x.body||''), state:x.state,
          html_url:x.html_url, created_at:x.created_at});
      }
      renderTabs(); renderView();
    })
    .catch(()=>{ ISSUES=[]; });
}
// 커밋된 링크 + 아직 반영 전인 이슈 링크(접수됨)를 채널 기준으로 병합
function refLinksFor(client, key){
  const saved=(((client.referenceLinks||{}).links)||[]).filter(l=>!key||l.channel===key);
  const have=new Set(saved.map(l=>l.channel+'|'+l.url.replace(/\/+$/,'')));
  const incoming=REF_ISSUES.filter(r=>(!key||r.channel===key)&&!have.has(r.channel+'|'+r.url.replace(/\/+$/,'')))
    .map(r=>({url:r.url, channel:r.channel, note:r.note||undefined, status:'received', addedAt:r.at, issueUrl:r.issueUrl}));
  return saved.concat(incoming);
}

  const mAll=pubF.map(p=>({t:p.time,v:p.views,l:p.likes,e:p.engagementRate}))
    .concat(planPubF.map(it=>{const m=it.metrics||{};return {t:it.publishedAt||it.scheduledFor,v:m.views||0,l:m.likes||0,e:m.engagementRate||0};}));
  const avgF=mAll.length?mAll.reduce((a,x)=>a+x.e,0)/mAll.length:0;
  let h='<div class="panel" style="border-color:#c8e0d0;background:#f8fcf9"><div class="sect-h" style="margin:0 0 10px"><h3>📊 콘텐츠 리포트 · '+esc(chLabel)+'</h3><span class="muted">'+periodLabel()+' · 실측 집계</span></div>';
  h+='<div class="kpis">'+
    kpi(mAll.length,'발행됨'+(period.key!=='all'?' (기간)':''))+
    kpi(waiting.length,'발행 대기')+
    kpi(pct(avgF)+' '+tIcon(c.stats.trend),'평균 참여율',true)+
    kpi(mAll.reduce((a,x)=>a+x.v,0),'누적 조회')+
    kpi(mAll.reduce((a,x)=>a+x.l,0),'누적 좋아요')+'</div>';
  const seriesF=mAll.slice().sort((a,b)=>String(a.t||'').localeCompare(String(b.t||''))).map(x=>x.e*100);
  if(seriesF.length>1){h+='<div style="margin-top:10px"><div class="muted" style="font-size:12px;margin-bottom:4px">반응도 추세 (참여율 %)</div>'+sparkline(seriesF.slice(-12))+'</div>';}
  // 콘텐츠별 성과 — 기획 발행분(성과+인사이트) + 사이클 발행분
  const rows=planPubF.slice().sort((a,b)=>String(b.publishedAt||'').localeCompare(String(a.publishedAt||''))).map(it=>{const m=it.metrics||{};

      '<td>'+(m.views||0)+'</td><td>'+(m.likes||0)+'</td><td>'+(m.comments||0)+'</td><td>'+pct(m.engagementRate||0)+'</td>'+
      '<td>'+(it.publishedUrl?'<a href="'+esc(it.publishedUrl)+'" target="_blank">열기↗</a>':'')+'</td></tr>';
  }).concat(pubF.map(p=>'<tr><td><b>'+esc(p.topic)+'</b><div class="muted">'+ftime(p.time)+'</div></td>'+

function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}

// 네이버 붙여넣기용 평문(마크다운 기호 제거, 이미지 위치는 마커로)
function plainPostText(it){
  let n=0;
  return String(it.captionBody||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ n++; return '\n[📷 이미지'+n+' 삽입]\n'; }
    if(t.startsWith('## ')) return '\n■ '+t.slice(3);
    if(t.startsWith('# ')) return t.slice(2);
    if(t==='>'||t.startsWith('> ')) return t.replace(/^>\s?/,'');
    return line.replace(/\*\*([^*]+)\*\*/g,'$1');
  }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

  navigator.clipboard.writeText(it[field]).then(()=>flash(btnId,'✅ 복사됨!')).catch(()=>alert('복사 실패 — 직접 복사하세요.'));
}
function copyTags(id,btnId){

  navigator.clipboard.writeText(it.ytTags.join(', ')).then(()=>flash(btnId,'✅ 복사됨!')).catch(()=>{});
